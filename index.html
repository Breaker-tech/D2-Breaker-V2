<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Destiny 2 — Command Center v10.0</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --bg-panel: #0f141d;
            --bg-card: #151c28;
            --bg-slot: #090d14;
            --border: #1e293b;
            --accent: #38bdf8;
            --gold: #eab308;
            --purple: #a855f7;
            --blue: #3b82f6;
            --green: #22c55e;
            --red-deepsight: #ea580c;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 1520px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .topbar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .brand h2 { margin: 0; font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
        .user-pill {
            background: #132036;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            transition: all 0.15s;
        }
        button:hover { background-color: #0369a1; }
        button.btn-login { background: var(--gold); color: #090c10; font-size: 0.9rem; padding: 9px 18px; }
        button.btn-login:hover { background: #ca8a04; }
        button.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        button.btn-ghost:hover { color: white; border-color: var(--muted); }
        button.btn-green { background: #15803d; color: #fff; }
        button.btn-green:hover { background: #16a34a; }
        button.btn-toggle { background: var(--bg-panel); border: 1px solid var(--border); color: var(--muted); }
        button.btn-toggle.active { background: #431407; border-color: var(--gold); color: var(--gold); }

        input, select {
            background: #05070a;
            border: 1px solid #334155;
            color: white;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .config-drawer {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: none;
        }
        .config-drawer.open { display: block; }

        .nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .char-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .char-card {
            background: var(--bg-panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .char-card.active { border-color: var(--accent); background: #132036; }
        .char-card.drag-over {
            border-color: var(--gold) !important;
            background: rgba(234, 179, 8, 0.18) !important;
            transform: scale(1.04);
        }
        .char-emblem { width: 38px; height: 38px; border-radius: 5px; pointer-events: none; }
        .char-meta { pointer-events: none; }
        .char-meta h4 { margin: 0; font-size: 0.92rem; }
        .char-meta span { color: var(--gold); font-weight: 700; font-size: 0.8rem; }

        .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tab-btn { background: var(--bg-panel); border: 1px solid var(--border); color: var(--muted); padding: 9px 14px; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); background: #132036; }

        .guardian-stats-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 12px;
        }
        .g-stat-card {
            background: #090d14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px;
        }
        .g-stat-card.tier-10 {
            border-color: var(--gold);
            background: linear-gradient(180deg, rgba(234,179,8,0.08), #090d14);
        }
        .g-stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 5px; }
        .g-stat-name { font-weight: 700; color: #e2e8f0; }
        .g-stat-tier { font-weight: 800; padding: 1px 6px; border-radius: 4px; font-size: 0.72rem; background: #1e293b; color: var(--accent); }
        .g-stat-card.tier-10 .g-stat-tier { background: var(--gold); color: #090c10; }
        .g-stat-segments { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 6px; margin-bottom: 4px; }
        .g-seg { background: #1e293b; border-radius: 1px; }
        .g-seg.filled { background: var(--accent); }
        .g-stat-card.tier-10 .g-seg.filled { background: var(--gold); }
        .g-stat-sub { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); }
        .waste-warn { color: #f97316; }

        .builds-bar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .build-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .build-chip {
            background: #132036;
            border: 1px solid #283a5e;
            border-radius: 6px;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        .build-chip b { color: var(--text); }
        .build-chip button { padding: 3px 8px; font-size: 0.72rem; }

        .postmaster-box {
            background: linear-gradient(90deg, #1e1b4b, #0f141d);
            border: 1px solid var(--purple);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }

        .status-bar {
            background: #0c1322;
            border-left: 3px solid var(--accent);
            padding: 7px 12px;
            font-size: 0.85rem;
            color: var(--accent);
            border-radius: 4px;
            margin-bottom: 14px;
        }

        .loadout-workspace {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 1150px) { .loadout-workspace { grid-template-columns: 1fr; } }
        .slots-column { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
        .slot-row {
            display: grid;
            grid-template-columns: 120px 310px 1fr;
            gap: 12px;
            align-items: stretch;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        @media (max-width: 780px) { .slot-row { grid-template-columns: 1fr; } }
        .slot-row:last-child { border-bottom: none; }
        .slot-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; }
        .drop-zone {
            min-height: 76px;
            background: var(--bg-slot);
            border: 1px dashed #26334d;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            transition: all 0.15s;
        }
        .drop-zone.equipped-zone { border: 1px solid #283650; background: #0b111c; padding: 8px 10px; }
        .drop-zone.drag-over { border-color: var(--gold) !important; background: rgba(234, 179, 8, 0.12) !important; }

        .equipped-detail-card { width: 100%; cursor: grab; user-select: none; }
        .eq-top { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
        .eq-title { flex: 1; min-width: 0; }
        .eq-title h4 { margin: 0; font-size: 0.9rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .eq-title span { font-size: 0.72rem; color: var(--muted); }
        .eq-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
            background: #06090f;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #192336;
        }
        .mini-stat { display: flex; align-items: center; justify-content: space-between; font-size: 0.7rem; gap: 6px; }
        .mini-stat-name { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-stat-bar-wrap { flex: 1; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; min-width: 28px; }
        .mini-stat-bar { height: 100%; background: var(--accent); }
        .mini-stat-val { font-weight: 700; color: var(--text); min-width: 20px; text-align: right; }
        .eq-perks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .eq-perk-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #111927;
            border: 1px solid #26334d;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.66rem;
            color: #cbd5e1;
        }
        .eq-perk-chip img { width: 13px; height: 13px; border-radius: 50%; }

        .gear-tile {
            width: 58px;
            height: 58px;
            position: relative;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            border: 2px solid #475569;
            background: #000;
            transition: transform 0.12s, box-shadow 0.12s;
            flex-shrink: 0;
        }
        .gear-tile:hover { transform: translateY(-2px) scale(1.04); z-index: 5; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35); }
        .gear-tile.tier-Exotic { border-color: var(--gold); }
        .gear-tile.tier-Superior { border-color: var(--purple); }
        .gear-tile.tier-Rare { border-color: var(--blue); }
        .gear-tile img { width: 100%; height: 100%; border-radius: 4px; display: block; pointer-events: none; }
        .tile-power {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: rgba(7, 10, 14, 0.9);
            color: var(--text);
            font-size: 0.66rem;
            font-weight: 800;
            text-align: center;
            padding: 1px 0;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            pointer-events: none;
        }
        .gear-tile.tier-Exotic .tile-power { color: var(--gold); }
        .dupe-tag {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--gold);
            color: #090c10;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            pointer-events: none;
        }

        .vault-column {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            position: sticky;
            top: 16px;
            max-height: 86vh;
            overflow-y: auto;
        }
        .vault-column.drag-over {
            border-color: var(--gold) !important;
            background: rgba(234, 179, 8, 0.08) !important;
        }
        .vault-slot-group { margin-bottom: 14px; }
        .vault-slot-group h5 { margin: 0 0 6px 0; font-size: 0.78rem; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        #itemInspector {
            position: fixed;
            z-index: 9999;
            width: 360px;
            background: #0b0f17;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
            display: none;
            overflow: hidden;
            pointer-events: none;
        }
        #itemInspector.pinned { pointer-events: auto; border: 2px solid var(--gold); }
        .insp-banner { padding: 12px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .insp-banner.tier-Exotic { background: linear-gradient(135deg, #713f12, #1f1608); }
        .insp-banner.tier-Superior { background: linear-gradient(135deg, #4c1d95, #180c2e); }
        .insp-banner.tier-Rare { background: linear-gradient(135deg, #1e3a8a, #0c1938); }
        .insp-icon { width: 52px; height: 52px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); }
        .insp-title { flex: 1; min-width: 0; }
        .insp-title h3 { margin: 0; font-size: 1rem; color: #fff; }
        .insp-title small { color: #cbd5e1; font-size: 0.78rem; display: block; margin-top: 2px; }
        .insp-power { font-size: 1.15rem; font-weight: 800; color: var(--gold); }
        .insp-body { padding: 12px 14px; }
        .insp-flavor { font-style: italic; font-size: 0.76rem; color: #94a3b8; margin: 0 0 10px 0; }
        .insp-stat-row { display: grid; grid-template-columns: 110px 1fr 32px; gap: 8px; align-items: center; font-size: 0.76rem; margin-bottom: 5px; }
        .insp-stat-bar { height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .insp-stat-fill { height: 100%; background: #f8fafc; }
        .insp-perk-item { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1e293b; }
        .insp-perk-item img { width: 24px; height: 24px; border-radius: 50%; background: #1e293b; flex-shrink: 0; }
        .insp-perk-item b { font-size: 0.8rem; color: var(--accent); display: block; }
        .insp-perk-item span { font-size: 0.72rem; color: #94a3b8; line-height: 1.25; display: block; }
        .insp-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }
        .insp-actions button { flex: 1 1 45%; padding: 7px 8px; font-size: 0.75rem; }

        .vendor-section { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
        .vendor-header { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px; }
        .vendor-icon { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--accent); }
        .vendor-cat-title { font-size: 0.78rem; text-transform: uppercase; color: var(--gold); margin: 10px 0 8px 0; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
        .item-card:hover { border-color: var(--accent); }
        .item-card.tier-Exotic { border-left: 4px solid var(--gold); }
        .item-card.tier-Superior { border-left: 4px solid var(--purple); }
        .item-card.tier-Rare { border-left: 4px solid var(--blue); }
        .item-card.deepsight-active { border-left: 4px solid var(--red-deepsight); box-shadow: inset 0 0 12px rgba(234, 88, 12, 0.12); }
        .item-card.catalyst-progress { border-left: 4px solid var(--accent); box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.12); }
        .item-card.missing { opacity: 0.55; border-left: 4px solid #ef4444; }
        .item-icon { width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0; }
        .item-icon.red-border { border: 2px solid var(--red-deepsight); }
        .item-info { flex: 1; min-width: 0; }
        .item-info h4 { margin: 0 0 3px 0; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-info p { margin: 0; font-size: 0.74rem; color: var(--muted); }
        .badge { display: inline-block; font-size: 0.66rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-top: 4px; background: #0c4a6e; color: #7dd3fc; }
        .badge.craft-ok { background: #14532d; color: #86efac; }
        .badge.craft-pending { background: #431407; color: #fdba74; border: 1px solid var(--red-deepsight); }
        .badge.cat-progress { background: #0c4a6e; color: #7dd3fc; border: 1px solid var(--accent); }
        .badge.cat-missing { background: #450a0a; color: #fca5a5; }

        .craft-prog-bar {
            height: 6px;
            background: #090d14;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid #26334d;
        }
        .craft-prog-fill { height: 100%; background: linear-gradient(90deg, #ea580c, #f97316); }
        .craft-prog-fill.blue { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .craft-prog-fill.done { background: linear-gradient(90deg, #16a34a, #22c55e); }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand">
            <h2>▲ DESTINY 2 COMMAND CENTER</h2>
            <span id="userBadge" class="user-pill" style="display:none;">Non connecté</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn-login" id="btnMainLogin" onclick="connexionRapideBungie()">Se connecter avec Bungie.net</button>
            <button onclick="lancerAnalyse()">↻ Actualiser</button>
            <button class="btn-ghost" onclick="basculerConfig()">⚙️ Config</button>
        </div>
    </div>

    <div id="configDrawer" class="config-drawer">
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;">
            <div style="font-size:0.82rem; color:#94a3b8;">
                Rechercher un profil public sans OAuth :
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="bungieName" placeholder="Pseudo#1234" style="width:190px;">
                <button class="btn-green" onclick="enregistrerConfig()">💾 Chercher</button>
            </div>
        </div>
    </div>

    <div id="status" class="status-bar">
        <span id="statusText">Prêt. Clique sur "Se connecter avec Bungie.net" en haut à droite.</span>
    </div>

    <div class="nav-row">
        <div id="charBar" class="char-bar"></div>
        <div class="tabs">
            <button class="tab-btn active" id="btn-loadout" onclick="changerOnglet('loadout')">Équipement & Coffre</button>
            <button class="tab-btn" id="btn-crafting" onclick="changerOnglet('crafting')">🟥 Modèles (<span id="count-crafting">0</span>)</button>
            <button class="tab-btn" id="btn-catalysts" onclick="changerOnglet('catalysts')">✨ Catalyseurs (<span id="count-catalysts">0</span>)</button>
            <button class="tab-btn" id="btn-vendors" onclick="changerOnglet('vendors')">Marchands (<span id="count-vendors">0</span>)</button>
            <button class="tab-btn" id="btn-quests" onclick="changerOnglet('quests')">Quêtes (<span id="count-quests">0</span>)</button>
            <button class="tab-btn" id="btn-exotics" onclick="changerOnglet('exotics')">Collections (<span id="count-exotics">0</span>)</button>
            <button class="tab-btn" id="btn-triumphs" onclick="changerOnglet('triumphs')">Triomphes (<span id="count-triumphs">0</span>)</button>
        </div>
    </div>

    <div id="guardianStatsPanel" class="guardian-stats-panel" style="display:none;"></div>

    <div id="buildsBar" class="builds-bar" style="display:none;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <b style="color:var(--accent); font-size:0.86rem;">⚡ Mes Builds :</b>
            <input type="text" id="nomNouveauBuild" placeholder="Nom du build..." style="width:210px;">
            <button class="btn-green" onclick="sauvegarderBuildActuel()">+ Sauvegarder</button>
        </div>
        <div id="listeBuildsChips" class="build-chips"></div>
    </div>

    <div id="postmasterBox" class="postmaster-box" style="display:none;"></div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
        <button id="btnFiltreDoublons" class="btn-toggle" onclick="basculerFiltreDoublons()">🔁 Doublons (<span id="count-dupes">0</span>)</button>
        <select id="filtreMarchand" onchange="afficherVue()" style="display:none;"></select>
        <select id="filtreEtat" onchange="afficherVue()" style="display:none;">
            <option value="all">État : Tout afficher</option>
            <option value="missing">À faire / Manquants uniquement</option>
            <option value="owned">Complétés / Obtenus uniquement</option>
        </select>
        <select id="filtreCategorie" onchange="afficherVue()">
            <option value="all">Catégorie : Toutes</option>
            <option value="weapon">Armes</option>
            <option value="armor">Armures</option>
            <option value="Exotic">Exotiques</option>
        </select>
        <input type="text" id="rechercheTexte" placeholder="Rechercher..." oninput="afficherVue()" style="flex:1;">
    </div>

    <div id="mainView"></div>
    <div id="itemInspector"></div>

    <script>
        const DEFAULT_API_KEY = "b5ca5b2b28314f6785135d45d6a5e981";
        const DEFAULT_CLIENT_ID = "56923";

        const BUCKET_POSTMASTER = 215593132;
        const SLOTS_DESTINY = [
            { hash: 1498876634, nom: "Arme Cinétique", type: "weapon" },
            { hash: 2465295065, nom: "Arme Énergétique", type: "weapon" },
            { hash: 953998645,  nom: "Arme Puissante", type: "weapon" },
            { hash: 3448274439, nom: "Casque", type: "armor" },
            { hash: 3551918588, nom: "Gantelets", type: "armor" },
            { hash: 14239492,   nom: "Armure de Torse", type: "armor" },
            { hash: 20886954,   nom: "Armure de Jambes", type: "armor" },
            { hash: 1585787867, nom: "Objet de Classe", type: "armor" }
        ];
        const BUCKETS_CONNUS = new Set(SLOTS_DESTINY.map(s => s.hash));

        const STATS_ARMES_ORDRE = [
            4043523819, 1240592695, 155624089, 943549884,
            4188031367, 4284893193, 2961396640, 447667954, 3871231066
        ];
        const STATS_GARDIEN_6 = [
            { hash: 2996146975, nom: "Mobilité" },
            { hash: 392767087,  nom: "Résistance" },
            { hash: 1943323491, nom: "Récupération" },
            { hash: 1735777505, nom: "Discipline" },
            { hash: 144602215,  nom: "Intelligence" },
            { hash: 4244567218, nom: "Force" }
        ];
        const STATS_ARMURES_ORDRE = STATS_GARDIEN_6.map(s => s.hash);
        const classesNom = { 0: 'Titan', 1: 'Chasseur', 2: 'Arcaniste' };

        let ongletActif = 'loadout';
        let filtreDoublonsActif = false;
        let joueurInfo = null;
        let persoActifId = null;
        let dictGlobal = {};
        let mapPersos = {};
        let listeCoffre = [];
        let compteDoublons = {};
        let listeCrafting = [];
        let listeCatalyseurs = [];
        let groupesMarchands = {};
        let listeQuetes = [];
        let listeExotiques = [];
        let listeTriomphes = [];
        let registreObjets = {};
        let objetGlisse = null;
        let inspecteurVerrouille = false;

        window.onload = async () => {
            localStorage.setItem('d2_apiKey', DEFAULT_API_KEY);
            localStorage.setItem('d2_clientId', DEFAULT_CLIENT_ID);

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bungieName')) localStorage.setItem('d2_bungieName', urlParams.get('bungieName'));

            if (localStorage.getItem('d2_bungieName')) {
                document.getElementById('bungieName').value = localStorage.getItem('d2_bungieName');
            }

            document.addEventListener('click', (e) => {
                const insp = document.getElementById('itemInspector');
                if (inspecteurVerrouille && !insp.contains(e.target) && !e.target.closest('[data-ukey]')) {
                    fermerInspecteur(true);
                }
            });

            if (urlParams.get('code')) {
                const code = urlParams.get('code');
                window.history.replaceState({}, document.title, window.location.pathname);
                await echangerCodeOAuth(code);
                return;
            }

            if (localStorage.getItem('d2_accessToken') || localStorage.getItem('d2_refreshToken') || localStorage.getItem('d2_bungieName')) {
                lancerAnalyse();
            }
        };

        function basculerConfig() { document.getElementById('configDrawer').classList.toggle('open'); }
        function setStatus(msg) { document.getElementById('statusText').textContent = msg; }

        function basculerFiltreDoublons() {
            filtreDoublonsActif = !filtreDoublonsActif;
            document.getElementById('btnFiltreDoublons').classList.toggle('active', filtreDoublonsActif);
            afficherVue();
        }

        function enregistrerConfig() {
            const b = document.getElementById('bungieName').value.trim();
            if (b) localStorage.setItem('d2_bungieName', b);
            document.getElementById('configDrawer').classList.remove('open');
            lancerAnalyse();
        }

        function connexionRapideBungie() {
            window.location.href = `https://www.bungie.net/fr/OAuth/Authorize?client_id=${DEFAULT_CLIENT_ID}&response_type=code`;
        }

        async function echangerCodeOAuth(codeRecu) {
            if (!codeRecu) return;
            try {
                setStatus("Connexion OAuth à Bungie.net en cours...");
                const resp = await fetch('https://www.bungie.net/Platform/App/OAuth/Token/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-API-Key': DEFAULT_API_KEY },
                    body: new URLSearchParams({ grant_type: 'authorization_code', code: codeRecu, client_id: DEFAULT_CLIENT_ID })
                });
                const data = await resp.json();
                if (data.access_token) {
                    sauvegarderTokens(data);
                    document.getElementById('configDrawer').classList.remove('open');
                    lancerAnalyse();
                } else {
                    setStatus("Erreur OAuth : " + (data.error_description || "Code expiré."));
                }
            } catch (e) { setStatus("Erreur OAuth : " + e.message); }
        }

        function sauvegarderTokens(data) {
            localStorage.setItem('d2_accessToken', data.access_token);
            if (data.refresh_token) localStorage.setItem('d2_refreshToken', data.refresh_token);
            localStorage.setItem('d2_tokenExpiry', Date.now() + (data.expires_in * 1000) - 60000);
        }

        async function obtenirTokenValide() {
            const token = localStorage.getItem('d2_accessToken');
            const expiry = parseInt(localStorage.getItem('d2_tokenExpiry') || '0');
            const refresh = localStorage.getItem('d2_refreshToken');

            if (token && Date.now() < expiry) return token;
            if (refresh) {
                try {
                    const resp = await fetch('https://www.bungie.net/Platform/App/OAuth/Token/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-API-Key': DEFAULT_API_KEY },
                        body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refresh, client_id: DEFAULT_CLIENT_ID })
                    });
                    const data = await resp.json();
                    if (data.access_token) {
                        sauvegarderTokens(data);
                        return data.access_token;
                    }
                } catch (e) { console.warn(e); }
            }
            if (token && Date.now() >= expiry) {
                localStorage.removeItem('d2_accessToken');
                return null;
            }
            return token;
        }

        async function identifierJoueur(accessToken) {
            if (accessToken) {
                const resp = await fetch('https://www.bungie.net/Platform/User/GetMembershipsForCurrentUser/', {
                    headers: { 'X-API-Key': DEFAULT_API_KEY, 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await resp.json();
                const memberships = data.Response?.destinyMemberships || [];
                if (memberships.length > 0) {
                    const primaryId = data.Response.primaryMembershipId;
                    return memberships.find(x => x.membershipId === primaryId)
                        || memberships.find(x => x.applicableMembershipTypes && x.applicableMembershipTypes.length > 0)
                        || memberships[0];
                }
            }
            const fullBungieName = document.getElementById('bungieName').value.trim();
            if (!fullBungieName.includes('#')) throw new Error("Clique sur 'Se connecter avec Bungie.net' en haut à droite.");
            const [displayName, displayNameCode] = fullBungieName.split('#');
            const searchResp = await fetch('https://www.bungie.net/Platform/Destiny2/SearchDestinyPlayerByBungieName/-1/', {
                method: 'POST',
                headers: { 'X-API-Key': DEFAULT_API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ displayName, displayNameCode: parseInt(displayNameCode) })
            });
            const searchData = await searchResp.json();
            return searchData.Response[0];
        }

        function extrairePerksDetails(instanceId, itemPerks) {
            const liste = [];
            if (instanceId && itemPerks[instanceId]?.perks && dictGlobal.perks) {
                const dejaVu = new Set();
                itemPerks[instanceId].perks.forEach(p => {
                    const pDef = dictGlobal.perks[p.perkHash];
                    if (p.visible && pDef?.displayProperties?.name && !dejaVu.has(pDef.displayProperties.name) && liste.length < 5) {
                        dejaVu.add(pDef.displayProperties.name);
                        liste.push({
                            nom: pDef.displayProperties.name,
                            desc: pDef.displayProperties.description || "",
                            icone: pDef.displayProperties.icon ? 'https://www.bungie.net' + pDef.displayProperties.icon : ''
                        });
                    }
                });
            }
            return liste;
        }

        function extraireStatsObjet(def, instanceId, itemStatsMap) {
            const estArme = def.itemType === 3;
            const ordreCible = estArme ? STATS_ARMES_ORDRE : STATS_ARMURES_ORDRE;
            const liveStats = (instanceId && itemStatsMap && itemStatsMap[instanceId]?.stats) ? itemStatsMap[instanceId].stats : {};
            const baseStats = def.stats?.stats || {};

            const resultat = [];
            let totalArmure = 0;

            ordreCible.forEach(statHash => {
                const val = liveStats[statHash]?.value ?? baseStats[statHash]?.value;
                const sDef = dictGlobal.stats?.[statHash];
                if (val !== undefined && val > 0 && sDef?.displayProperties?.name) {
                    const nomCourt = sDef.displayProperties.name
                        .replace('Vitesse de rechargement', 'Rechargement')
                        .replace('Coups par minute', 'Cadence (CPM)');
                    resultat.push({
                        hash: statHash,
                        nom: nomCourt,
                        val: val,
                        isBar: ![4284893193, 3871231066, 2961396640, 447667954].includes(statHash)
                    });
                    if (!estArme) totalArmure += val;
                }
            });

            if (!estArme && totalArmure > 0) {
                resultat.push({ hash: 0, nom: "Total des stats", val: totalArmure, isBar: false, isTotal: true });
            }
            return resultat;
        }

        function formaterEquipement(item, lieuType, charIdOwner, instances, itemPerks, itemStatsMap, forcePostmaster = false) {
            const def = dictGlobal.items[item.itemHash];
            if (!def || !def.displayProperties?.name) return null;
            const bucketHash = def.inventory?.bucketTypeHash;
            if (!forcePostmaster && !BUCKETS_CONNUS.has(bucketHash)) return null;

            const instanceId = item.itemInstanceId;
            const power = instanceId && instances[instanceId]?.primaryStat?.value ? instances[instanceId].primaryStat.value : null;
            const tierKey = def.inventory?.tierType === 6 ? 'Exotic' : (def.inventory?.tierType === 5 ? 'Superior' : 'Rare');
            const perks = extrairePerksDetails(instanceId, itemPerks);
            const stats = extraireStatsObjet(def, instanceId, itemStatsMap);
            const ukey = instanceId || ('hash_' + item.itemHash + '_' + Math.random().toString(36).substring(2, 7));

            const obj = {
                ukey,
                nom: def.displayProperties.name,
                typeNom: def.itemTypeDisplayName || 'Équipement',
                flavor: def.flavorText || "",
                itemHash: item.itemHash,
                itemInstanceId: instanceId,
                stackSize: item.quantity || 1,
                bucketHash: bucketHash,
                lieuType: lieuType,
                charIdOwner: charIdOwner,
                icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : '',
                power: power,
                perks: perks,
                stats: stats,
                categorie: def.itemType === 3 ? 'weapon' : 'armor',
                tier: tierKey
            };
            registreObjets[ukey] = obj;
            return obj;
        }

        // Collecte récursive des hashes de Triomphes dans un nœud de présentation (ex: Catalyseurs exotiques)
        function collecterRecordsDansNoeud(nodeHash, visited = new Set()) {
            const res = [];
            if (!nodeHash || visited.has(nodeHash)) return res;
            visited.add(nodeHash);
            const node = dictGlobal.nodes?.[nodeHash];
            if (!node) return res;
            (node.children?.records || []).forEach(r => res.push(r.recordHash));
            (node.children?.presentationNodes || []).forEach(child => {
                res.push(...collecterRecordsDansNoeud(child.presentationNodeHash, visited));
            });
            return res;
        }

        async function lancerAnalyse() {
            try {
                const accessToken = await obtenirTokenValide();
                setStatus("1/3 — Identification du Gardien...");
                joueurInfo = await identifierJoueur(accessToken);

                const nomAffiche = joueurInfo.bungieGlobalDisplayName
                    ? `${joueurInfo.bungieGlobalDisplayName}#${joueurInfo.bungieGlobalDisplayNameCode}`
                    : (joueurInfo.displayName || "Gardien Connecté");
                const badge = document.getElementById('userBadge');
                badge.textContent = "✦ " + nomAffiche;
                badge.style.display = "inline-block";
                if (accessToken) document.getElementById('btnMainLogin').textContent = "✓ Compte Bungie Lié";

                if (!dictGlobal.items) {
                    setStatus("2/3 — Chargement du Manifest FR...");
                    const manifestResp = await fetch('https://www.bungie.net/Platform/Destiny2/Manifest/', { headers: { 'X-API-Key': DEFAULT_API_KEY } });
                    const manifestData = await manifestResp.json();
                    const cheminsFR = manifestData.Response.jsonWorldComponentContentPaths.fr;

                    const [items, collectibles, records, perks, vendors, stats, nodes] = await Promise.all([
                        fetch('https://www.bungie.net' + cheminsFR.DestinyInventoryItemDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinyCollectibleDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinyRecordDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinySandboxPerkDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinyVendorDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinyStatDefinition).then(r => r.json()),
                        fetch('https://www.bungie.net' + cheminsFR.DestinyPresentationNodeDefinition).then(r => r.json())
                    ]);
                    dictGlobal = { items, collectibles, records, perks, vendors, stats, nodes };
                }

                setStatus("3/3 — Lecture en direct : Personnages, Coffre, Doublons, Modèles et Catalyseurs...");
                const profileUrl = `https://www.bungie.net/Platform/Destiny2/${joueurInfo.membershipType}/Profile/${joueurInfo.membershipId}/?components=102,200,201,205,300,302,304,800,900`;
                const headers = { 'X-API-Key': DEFAULT_API_KEY };
                if (accessToken) headers['Authorization'] = `Bearer ${accessToken}`;

                const profileResp = await fetch(profileUrl, { headers });
                const profileData = await profileResp.json();
                const resp = profileData.Response;

                const instances = resp.itemComponents?.instances?.data || {};
                const itemPerks = resp.itemComponents?.perks?.data || {};
                const itemStatsMap = resp.itemComponents?.stats?.data || {};
                registreObjets = {};
                compteDoublons = {};

                const compterItem = (fmt) => {
                    if (!fmt) return;
                    compteDoublons[fmt.itemHash] = (compteDoublons[fmt.itemHash] || 0) + 1;
                };

                mapPersos = {};
                for (const [cId, c] of Object.entries(resp.characters?.data || {})) {
                    mapPersos[cId] = {
                        id: cId,
                        classeNom: classesNom[c.classType] || 'Gardien',
                        light: c.light,
                        statsGlobales: c.stats || {},
                        emblem: c.emblemPath ? 'https://www.bungie.net' + c.emblemPath : '',
                        equipped: [],
                        inventory: [],
                        postmaster: []
                    };
                }
                if (!persoActifId || !mapPersos[persoActifId]) {
                    persoActifId = Object.keys(mapPersos)[0];
                }
                afficherBarrePersos();

                for (const [cId, data] of Object.entries(resp.characterEquipment?.data || {})) {
                    data.items.forEach(i => {
                        const fmt = formaterEquipement(i, 'equipped', cId, instances, itemPerks, itemStatsMap);
                        if (fmt) { mapPersos[cId].equipped.push(fmt); compterItem(fmt); }
                    });
                }

                listeQuetes = [];
                for (const [cId, data] of Object.entries(resp.characterInventories?.data || {})) {
                    data.items.forEach(i => {
                        const def = dictGlobal.items[i.itemHash];
                        if (!def) return;
                        if (i.bucketHash === BUCKET_POSTMASTER) {
                            const fmtPost = formaterEquipement(i, 'postmaster', cId, instances, itemPerks, itemStatsMap, true);
                            if (fmtPost) mapPersos[cId].postmaster.push(fmtPost);
                        } else if (def.itemType === 12 || (def.itemCategoryHashes && def.itemCategoryHashes.includes(53))) {
                            listeQuetes.push({
                                nom: def.displayProperties.name,
                                source: def.displayProperties.description || "Quête / Contrat",
                                icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : '',
                                possede: false,
                                categorie: 'quest',
                                tier: 'Superior',
                                badgeTexte: mapPersos[cId]?.classeNom || 'Quête'
                            });
                        } else {
                            const fmt = formaterEquipement(i, 'inventory', cId, instances, itemPerks, itemStatsMap);
                            if (fmt) { mapPersos[cId].inventory.push(fmt); compterItem(fmt); }
                        }
                    });
                }

                listeCoffre = [];
                (resp.profileInventory?.data?.items || []).forEach(i => {
                    const fmt = formaterEquipement(i, 'vault', null, instances, itemPerks, itemStatsMap);
                    if (fmt) { listeCoffre.push(fmt); compterItem(fmt); }
                });
                listeCoffre.sort((a, b) => (b.power || 0) - (a.power || 0));

                // Compter le nombre total d'exemplaires en doublon
                let nbDoublons = 0;
                Object.values(compteDoublons).forEach(cnt => { if (cnt > 1) nbDoublons += cnt; });
                document.getElementById('count-dupes').textContent = nbDoublons;

                const mapArmesParNom = {};
                for (const itemDef of Object.values(dictGlobal.items)) {
                    if (itemDef.itemType === 3 && itemDef.displayProperties?.name && itemDef.inventory?.tierType >= 5) {
                        mapArmesParNom[itemDef.displayProperties.name] = itemDef;
                    }
                }

                // Collections (800)
                const collectiblesJoueur = { ...(resp.profileCollectibles?.data?.collectibles || {}) };
                for (const cId in (resp.characterCollectibles?.data || {})) {
                    Object.assign(collectiblesJoueur, resp.characterCollectibles.data[cId].collectibles);
                }
                listeExotiques = [];
                for (const [hash, def] of Object.entries(dictGlobal.collectibles)) {
                    if (!def.displayProperties?.name || !def.displayProperties?.icon) continue;
                    const itemDef = dictGlobal.items[def.itemHash];
                    const isExo = itemDef?.inventory?.tierType === 6;
                    const cat = itemDef?.itemType === 3 ? 'weapon' : (itemDef?.itemType === 2 ? 'armor' : 'other');
                    const possede = ((collectiblesJoueur[hash]?.state ?? 1) & 1) === 0;
                    const ukey = 'col_' + hash;
                    const obj = {
                        ukey,
                        nom: def.displayProperties.name,
                        typeNom: itemDef?.itemTypeDisplayName || "Collection",
                        flavor: itemDef?.flavorText || "",
                        source: def.sourceString || "Collection Destiny 2",
                        icone: 'https://www.bungie.net' + def.displayProperties.icon,
                        possede,
                        categorie: cat,
                        tier: isExo ? 'Exotic' : 'Superior',
                        badgeTexte: possede ? 'Débloqué' : 'Manquant',
                        stats: itemDef ? extraireStatsObjet(itemDef, null, null) : [],
                        perks: []
                    };
                    registreObjets[ukey] = obj;
                    listeExotiques.push(obj);
                }

                // Triomphes, Modèles (Crafting) & Catalyseurs Exotiques (Composant 900)
                const recordsJoueur = { ...(resp.profileRecords?.data?.records || {}) };
                for (const cId in (resp.characterRecords?.data || {})) {
                    Object.assign(recordsJoueur, resp.characterRecords.data[cId].records);
                }

                // Repérer les hashes officiels des Catalyseurs Exotiques dans DestinyPresentationNodeDefinition
                const hashesCatalyseurs = new Set();
                for (const n of Object.values(dictGlobal.nodes || {})) {
                    const nNom = (n.displayProperties?.name || "").toLowerCase();
                    if (nNom === "catalyseurs exotiques" || nNom.includes("catalyseurs exotiques") || n.hash === 1984921914) {
                        collecterRecordsDansNoeud(n.hash).forEach(rh => hashesCatalyseurs.add(String(rh)));
                    }
                }

                listeTriomphes = [];
                listeCrafting = [];
                listeCatalyseurs = [];
                const nomsCraftingVus = new Set();
                const nomsCatVus = new Set();

                for (const [hash, rec] of Object.entries(recordsJoueur)) {
                    const def = dictGlobal.records[hash];
                    if (!def || !def.displayProperties?.name) continue;
                    const nomRec = def.displayProperties.name;
                    const descRec = def.displayProperties.description || "";
                    const complete = (rec.state & 4) === 0;

                    // 1. Détection Catalyseur Exotique
                    const estCatalyseur = hashesCatalyseurs.has(String(hash)) || nomRec.toLowerCase().startsWith('catalyseur');
                    if (estCatalyseur && !nomsCatVus.has(nomRec)) {
                        nomsCatVus.add(nomRec);
                        const objs = rec.objectives || [];
                        // On choisit l'objectif chiffré principal (celui avec la plus grande cible, ex: 500 frags)
                        let mainObj = objs[0] || { progress: 0, completionValue: 1 };
                        objs.forEach(o => { if ((o.completionValue || 0) >= (mainObj.completionValue || 0)) mainObj = o; });
                        const prog = mainObj.progress || 0;
                        const max = mainObj.completionValue || 1;
                        const enCours = !complete && (prog > 0 || objs.some(o => o.complete));

                        const ukey = 'cat_' + hash;
                        const objCat = {
                            ukey,
                            nom: nomRec,
                            typeNom: "Catalyseur Exotique",
                            flavor: descRec,
                            source: descRec || "Catalyseur d'arme exotique",
                            icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : 'https://www.bungie.net/img/misc/missing_icon_d2.png',
                            possede: complete,
                            enCours: enCours,
                            progActuel: prog,
                            progMax: max,
                            categorie: 'weapon',
                            tier: 'Exotic',
                            badgeTexte: complete ? '✓ Complété' : (enCours ? `⚡ En cours (${prog} / ${max})` : '🔒 Manquant / Non commencé'),
                            stats: [],
                            perks: []
                        };
                        registreObjets[ukey] = objCat;
                        listeCatalyseurs.push(objCat);
                        continue;
                    }

                    // 2. Détection Modèle d'arme façonnable (Crafting)
                    const armeMatch = mapArmesParNom[nomRec];
                    const objZero = rec.objectives && rec.objectives.length > 0 ? rec.objectives[0] : null;
                    const estModeleArme = armeMatch && objZero && objZero.completionValue >= 1 && objZero.completionValue <= 5 && !nomsCraftingVus.has(nomRec);

                    if (estModeleArme) {
                        nomsCraftingVus.add(nomRec);
                        const prog = objZero.progress || 0;
                        const max = objZero.completionValue || 5;
                        const ukey = 'craft_' + hash;
                        const objCraft = {
                            ukey,
                            nom: nomRec,
                            typeNom: armeMatch.itemTypeDisplayName || "Arme façonnable",
                            flavor: armeMatch.flavorText || "",
                            source: `${armeMatch.itemTypeDisplayName || 'Arme'} — ${prog} / ${max} bordures rouges`,
                            icone: 'https://www.bungie.net' + armeMatch.displayProperties.icon,
                            possede: complete,
                            progActuel: prog,
                            progMax: max,
                            categorie: 'weapon',
                            tier: armeMatch.inventory?.tierType === 6 ? 'Exotic' : 'Superior',
                            badgeTexte: complete ? '✓ Modèle Débloqué' : `🟥 ${prog} / ${max} Souvenirs`,
                            stats: extraireStatsObjet(armeMatch, null, null),
                            perks: []
                        };
                        registreObjets[ukey] = objCraft;
                        listeCrafting.push(objCraft);
                    } else {
                        listeTriomphes.push({
                            nom: nomRec,
                            source: descRec || "Triomphe",
                            icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : 'https://www.bungie.net/img/misc/missing_icon_d2.png',
                            possede: complete,
                            categorie: 'triumph',
                            tier: complete ? 'Exotic' : 'Rare',
                            badgeTexte: complete ? 'Complété' : 'À faire'
                        });
                    }
                }

                // Tri Modèles : En cours en premier, puis non commencés, puis débloqués
                listeCrafting.sort((a, b) => {
                    if (a.possede !== b.possede) return a.possede ? 1 : -1;
                    return (b.progActuel / b.progMax) - (a.progActuel / a.progMax);
                });

                // Tri Catalyseurs : En cours en premier, puis manquants, puis complétés
                listeCatalyseurs.sort((a, b) => {
                    const score = (x) => x.enCours ? 0 : (!x.possede ? 1 : 2);
                    if (score(a) !== score(b)) return score(a) - score(b);
                    return (b.progActuel / b.progMax) - (a.progActuel / a.progMax);
                });

                document.getElementById('count-crafting').textContent = listeCrafting.length;

                if (ongletActif === 'vendors') {

        function getCleBuilds() { return `d2_builds_${persoActifId || 'default'}`; }

            try { return JSON.parse(localStorage.getItem(getCleBuilds()) || '[]'); }
            catch { return []; }
        }

        function sauvegarderBuildActuel() {
            const p = mapPersos[persoActifId];
            if (!p || p.equipped.length === 0) return;

            const champNom = document.getElementById('nomNouveauBuild');
            const nom = champNom.value.trim() || `Build ${p.classeNom} (${p.light})`;

            const itemsBuild = p.equipped.map(item => ({
                itemHash: item.itemHash,
                itemInstanceId: item.itemInstanceId,
                bucketHash: item.bucketHash,
                nom: item.nom
            }));

            const builds = chargerBuildsLocale();
            builds.push({ id: Date.now(), nom, items: itemsBuild });
            localStorage.setItem(getCleBuilds(), JSON.stringify(builds));
            champNom.value = "";
            afficherBarreBuilds();
            setStatus(`Build "${nom}" sauvegardé !`);

            const builds = chargerBuildsLocale().filter(b => b.id !== id);
            localStorage.setItem(getCleBuilds(), JSON.stringify(builds));
            afficherBarreBuilds();
        }

        async function equiperBuildComplet(id) {
            const build = chargerBuildsLocale().find(b => b.id === id);
            if (!build || !joueurInfo) return;

            const mType = joueurInfo.membershipType;
            const idsAEquiper = [];

            try {
                setStatus(`Préparation du Build "${build.nom}"...`);
                for (const bItem of build.items) {
                    const dejaEquipe = mapPersos[persoActifId].equipped.find(x => x.itemInstanceId === bItem.itemInstanceId);
                    if (dejaEquipe) continue;

                    const dansCoffre = listeCoffre.find(x => x.itemInstanceId === bItem.itemInstanceId);
                    if (dansCoffre) {
                        setStatus(`Rapatriement de "${bItem.nom}" depuis le Coffre...`);
                        await appelActionBungie('TransferItem', {
                            itemReferenceHash: bItem.itemHash, stackSize: 1, transferToVault: false,
                            itemId: bItem.itemInstanceId, characterId: persoActifId, membershipType: mType
                        });
                    }
                    idsAEquiper.push(bItem.itemInstanceId);
                }

                if (idsAEquiper.length > 0) {
                    setStatus(`Équipement simultané des ${idsAEquiper.length} pièces...`);
                    const eq = await appelActionBungie('EquipItems', {
                        itemIds: idsAEquiper, characterId: persoActifId, membershipType: mType
                    });
                    if (eq.ErrorCode !== 1) throw new Error(eq.Message);
                }

                setStatus(`Build "${build.nom}" équipé !`);
                await lancerAnalyse();
            } catch (e) {
                setStatus(`Erreur Build : ${e.message} (En Orbite ou à la Tour requis).`);
            }
        }

        function afficherInspecteur(ev, ukey, verrouiller = false) {
            if (inspecteurVerrouille && !verrouiller) return;
            const item = registreObjets[ukey];
            if (!item) return;

            if (verrouiller) {
                ev.stopPropagation();
                inspecteurVerrouille = true;
            }

            const insp = document.getElementById('itemInspector');
            insp.classList.toggle('pinned', inspecteurVerrouille);

            const statsHtml = (item.stats || []).map(s => `
                <div class="insp-stat-row">
                    <span style="color:${s.isTotal ? 'var(--gold)' : '#cbd5e1'}; font-weight:${s.isTotal ? '700' : '400'};">${s.nom}</span>
                    ${s.isBar ? `<div class="insp-stat-bar"><div class="insp-stat-fill" style="width:${Math.min(100, s.val)}%;"></div></div>` : `<span></span>`}
                    <span style="text-align:right; font-weight:700; color:${s.isTotal ? 'var(--gold)' : '#fff'};">${s.val}</span>
                </div>
            `).join('');

            const perksHtml = (item.perks || []).map(p => `
                <div class="insp-perk-item">
                    ${p.icone ? `<img src="${p.icone}">` : ''}
                    <div>
                        <b>${p.nom}</b>
                        <span>${p.desc.substring(0, 110)}</span>
                    </div>
                </div>
            `).join('');

            let actionsHtml = '';
            if (inspecteurVerrouille) {
                const nomPerso = mapPersos[persoActifId]?.classeNom || 'Perso';
                if (item.lieuType === 'postmaster') {
                    actionsHtml = `
                        <div class="insp-actions">
                            <button class="btn-green" onclick="recupererDuPostmaster(${item.itemHash}, '${item.itemInstanceId}', ${item.stackSize})">📥 Récupérer</button>
                            <button class="btn-ghost" onclick="fermerInspecteur(true)">✕ Fermer</button>
                        </div>
                    `;
                } else if (item.itemInstanceId) {
                    // Boutons de transfert direct vers les autres personnages
                    let autresPersosHtml = '';
                    if (item.lieuType === 'inventory' || item.lieuType === 'vault') {
                        autresPersosHtml = Object.entries(mapPersos)
                            .filter(([cId]) => cId !== (item.charIdOwner || '') && !(item.lieuType === 'vault' && cId === persoActifId))
                            .map(([cId, p]) => `<button onclick="transfererVersAutrePerso(${item.itemHash}, '${item.itemInstanceId}', '${item.lieuType}', '${item.charIdOwner || ''}', '${cId}')">➔ ${p.classeNom}</button>`)
                            .join('');
                    }

                    actionsHtml = `
                        <div class="insp-actions">
                            ${item.lieuType !== 'equipped' ? `<button class="btn-green" onclick="executerMouvement('equipped', ${item.itemHash}, '${item.itemInstanceId}', '${item.lieuType}')">⚡ Équiper (${nomPerso})</button>` : ''}
                            ${item.lieuType === 'vault' ? `<button onclick="executerMouvement('inventory', ${item.itemHash}, '${item.itemInstanceId}', 'vault')">🎒 Sac (${nomPerso})</button>` : ''}
                            ${item.lieuType === 'inventory' ? `<button onclick="executerMouvement('vault', ${item.itemHash}, '${item.itemInstanceId}', 'inventory')">🏦 Coffre</button>` : ''}
                            ${autresPersosHtml}
                            <button class="btn-ghost" onclick="fermerInspecteur(true)">✕ Fermer</button>
                        </div>
                    `;
                } else {
                    actionsHtml = `<div class="insp-actions"><button class="btn-ghost" onclick="fermerInspecteur(true)">✕ Fermer</button></div>`;
                }
            }

            insp.innerHTML = `
                <div class="insp-banner tier-${item.tier}">
                    <img class="insp-icon" src="${item.icone}">
                    <div class="insp-title">
                        <h3>${item.nom}</h3>
                        <small>${item.typeNom}</small>
                    </div>
                    ${item.power ? `<div class="insp-power">✦ ${item.power}</div>` : ''}
                </div>
                <div class="insp-body">
                    ${item.flavor ? `<p class="insp-flavor">"${item.flavor}"</p>` : ''}
                    ${statsHtml || '<small style="color:#64748b;">Aucune statistique chiffrée.</small>'}
                    ${perksHtml}
                    ${actionsHtml}
                </div>

            insp.style.display = 'block';
            positionnerInspecteur(ev);
        }

        function positionnerInspecteur(ev) {
            const insp = document.getElementById('itemInspector');
            if (insp.style.display === 'none') return;
            const pad = 16;
            let x = ev.clientX + pad;
            let y = ev.clientY + pad;
            const rect = insp.getBoundingClientRect();
            if (x + rect.width > window.innerWidth - 12) x = ev.clientX - rect.width - pad;
            if (y + rect.height > window.innerHeight - 12) y = Math.max(12, window.innerHeight - rect.height - 12);
            insp.style.left = x + 'px';
            insp.style.top = y + 'px';
        }

        function bougerInspecteur(ev) { if (!inspecteurVerrouille) positionnerInspecteur(ev); }

        function fermerInspecteur(force = false) {
            if (inspecteurVerrouille && !force) return;
            inspecteurVerrouille = false;
            const insp = document.getElementById('itemInspector');
            insp.style.display = 'none';
            insp.classList.remove('pinned');
        }

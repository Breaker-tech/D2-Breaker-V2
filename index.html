<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny 2 — Command Center v14.0</title>
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

    <div class="topbar">
        <div class="brand">
            <h2>▲ DESTINY 2 COMMAND CENTER</h2>
            <span id="userBadge" class="user-pill" style="display:none;">Non connecté</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <button class="btn-compare" id="btnOpenCompare" onclick="basculerComparateur()">⚖️ Comparateur (<span id="count-compare">0</span>)</button>
            <button class="btn-login" id="btnMainLogin" onclick="connexionRapideBungie()">Se connecter avec Bungie.net</button>
            <button onclick="synchroniserInventaireRapide()" title="Met à jour uniquement le Coffre et les Personnages en ~0.4s">⚡ Synchro Inventaire</button>
            <button class="btn-ghost" onclick="lancerAnalyse()" title="Recharge tout (Triomphes, Collections, Jalons)">↻ Tout actualiser</button>
            <button class="btn-ghost" onclick="basculerConfig()">⚙️ Config</button>
        </div>
    </div>

    <div id="configDrawer" class="config-drawer">
        <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;">
            <div style="font-size:0.82rem; color:#94a3b8;">
                Rechercher un profil public sans OAuth ou gérer le cache local du Manifest :
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="bungieName" placeholder="Pseudo#1234" style="width:190px;">
                <button class="btn-green" onclick="enregistrerConfig()">💾 Chercher</button>
                <button class="btn-ghost" onclick="viderCacheManifest()">🗑️ Vider cache Manifest</button>
            </div>
        </div>
    </div>

    <div id="status" class="status-bar">
        <span id="statusText">Prêt. Clique sur "Se connecter avec Bungie.net" en haut à droite.</span>
        <span id="queueBadge" class="queue-badge"></span>
    </div>

    <div class="nav-row">
        <div id="charBar" class="char-bar"></div>
        <div class="tabs">
            <button class="tab-btn active" id="btn-loadout" onclick="changerOnglet('loadout')">Équipement & Coffre</button>
            <button class="tab-btn" id="btn-optimizer" onclick="changerOnglet('optimizer')">🛡️ Optimiseur</button>
            <button class="tab-btn" id="btn-milestones" onclick="changerOnglet('milestones')">📅 Jalons (<span id="count-milestones">0</span>)</button>
            <button class="tab-btn" id="btn-crafting" onclick="changerOnglet('crafting')">🟥 Modèles (<span id="count-crafting">0</span>)</button>
            <button class="tab-btn" id="btn-catalysts" onclick="changerOnglet('catalysts')">✨ Catalyseurs (<span id="count-catalysts">0</span>)</button>
            <button class="tab-btn" id="btn-vendors" onclick="changerOnglet('vendors')">Marchands (<span id="count-vendors">0</span>)</button>
            <button class="tab-btn" id="btn-quests" onclick="changerOnglet('quests')">Quêtes (<span id="count-quests">0</span>)</button>
            <button class="tab-btn" id="btn-exotics" onclick="changerOnglet('exotics')">Collections (<span id="count-exotics">0</span>)</button>
            <button class="tab-btn" id="btn-triumphs" onclick="changerOnglet('triumphs')">Triomphes (<span id="count-triumphs">0</span>)</button>
        </div>
    </div>

    <div id="guardianStatsPanel" class="guardian-stats-panel" style="display:none;"></div>

    <div id="buildsBar" class="builds-bar" style="display:none;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <b style="color:var(--accent); font-size:0.86rem;">⚡ Mes Builds :</b>
            <input type="text" id="nomNouveauBuild" placeholder="Nom du build..." style="width:210px;">
            <button class="btn-green" onclick="sauvegarderBuildActuel()">+ Sauvegarder</button>
        </div>
        <div id="listeBuildsChips" class="build-chips"></div>
    </div>

    <div id="postmasterBox" class="postmaster-box" style="display:none;"></div>

    <div id="globalFiltersBar" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;">
        <button id="btnFiltreDoublons" class="btn-toggle" onclick="basculerFiltreDoublons()">🔁 Doublons (<span id="count-dupes">0</span>)</button>
        <select id="filtreTag" onchange="afficherVue()">
            <option value="all">Tag : Tous</option>
            <option value="godroll">⭐ God Roll</option>
            <option value="keep">🔒 À garder</option>
            <option value="infuse">⚡ À infuser</option>
            <option value="junk">🗑️ À démanteler</option>
            <option value="untagged">Sans tag</option>
        </select>
        <button id="btnPullJunk" class="btn-danger" style="display:none;" onclick="rapatrierObjetsADemanteler()">🎒 Rapatrier les 🗑️ du Coffre</button>
        <select id="filtreMarchand" onchange="afficherVue()" style="display:none;"></select>
        <select id="filtreEtat" onchange="afficherVue()" style="display:none;">
            <option value="all">État : Tout afficher</option>
            <option value="missing">À faire / Manquants uniquement</option>
            <option value="owned">Complétés / Obtenus uniquement</option>
        </select>
        <select id="filtreCategorie" onchange="afficherVue()">
            <option value="all">Catégorie : Toutes</option>
            <option value="weapon">Armes</option>
            <option value="armor">Armures</option>
            <option value="Exotic">Exotiques</option>
        </select>
        <input type="text" id="rechercheTexte" placeholder="Rechercher..." oninput="afficherVue()" style="flex:1; min-width:160px;">
    </div>

    <div id="mainView"></div>
    <div id="itemInspector"></div>

    <div id="compareDrawer">
        <div class="compare-header">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <h3>⚖️ Comparateur d'équipement (<span id="compareHeaderCount">0</span>)</h3>
                <small style="color:#94a3b8;">Vert = meilleure stat • Rouge = plus faible</small>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn-ghost" onclick="viderComparateur()">🗑️ Tout vider</button>
                <button onclick="fermerComparateur()">✕ Fermer</button>
            </div>
        </div>
        <div id="compareContent" class="compare-scroll"></div>
    </div>

    <script src="app.js?v=14"></script>
</body>
</html>

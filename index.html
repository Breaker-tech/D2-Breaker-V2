<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Destiny 2 — Command Center v8</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --bg-panel: #0f141d;
            --bg-card: #151c28;
            --bg-slot: #090d14;
            --border: #1e293b;
            --accent: #38bdf8;
            --gold: #eab308;
            --purple: #a855f7;
            --blue: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 1520px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .topbar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand h2 { margin: 0; font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
        .user-pill {
            background: #132036;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            transition: all 0.15s;
        }
        button:hover { background-color: #0369a1; }
        button.btn-login { background: var(--gold); color: #090c10; font-size: 0.9rem; padding: 9px 18px; }
        button.btn-login:hover { background: #ca8a04; }
        button.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        button.btn-ghost:hover { color: white; border-color: var(--muted); }
        button.btn-green { background: #15803d; color: #fff; }
        button.btn-green:hover { background: #16a34a; }

        input, select {
            background: #05070a;
            border: 1px solid #334155;
            color: white;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .config-drawer {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: none;
        }
        .config-drawer.open { display: block; }

        .nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .char-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .char-card {
            background: var(--bg-panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

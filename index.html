<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>D2 Breaker</title>
    <style>
        :root {
            --bg-dark: #06090e;
            --bg-panel: #0f141d;
            --bg-card: #151c28;
            --bg-slot: #090d14;
            --border: #1e293b;
            --accent: #38bdf8;
            --gold: #eab308;
            --purple: #a855f7;
            --blue: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --red-deepsight: #ea580c;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            max-width: 1520px;
            margin: 0 auto;
            padding: 16px 20px 80px 20px;
        }
        .topbar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .brand h2 { margin: 0; font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
        .user-pill {
            background: #132036;
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            transition: all 0.15s;
        }
        button:hover { background-color: #0369a1; }
        button.btn-login { background: var(--gold); color: #090c10; font-size: 0.9rem; padding: 9px 18px; }
        button.btn-login:hover { background: #ca8a04; }
        button.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        button.btn-ghost:hover { color: white; border-color: var(--muted); }
        button.btn-green { background: #15803d; color: #fff; }
        button.btn-green:hover { background: #16a34a; }
        button.btn-danger { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
        button.btn-danger:hover { background: #991b1b; }
        button.btn-compare { background: #1e293b; border: 1px solid var(--accent); color: var(--accent); }
        button.btn-compare:hover { background: #0c4a6e; color: #fff; }
        button.btn-compare.has-items { background: #0284c7; color: #fff; border-color: #7dd3fc; }
        button.btn-toggle { background: var(--bg-panel); border: 1px solid var(--border); color: var(--muted); }
        button.btn-toggle.active { background: #431407; border-color: var(--gold); color: var(--gold); }

        input, select {
            background: #05070a;
            border: 1px solid #334155;
            color: white;
            padding: 7px 11px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .config-drawer {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: none;
        }
        .config-drawer.open { display: block; }

        .nav-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .char-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        .char-card {
            background: var(--bg-panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .char-card.active { border-color: var(--accent); background: #132036; }
        .char-card.drag-over {
            border-color: var(--gold) !important;
            background: rgba(234, 179, 8, 0.18) !important;
            transform: scale(1.04);
        }
        .char-emblem { width: 38px; height: 38px; border-radius: 5px; pointer-events: none; }
        .char-meta { pointer-events: none; }
        .char-meta h4 { margin: 0; font-size: 0.92rem; }
        .char-meta span { color: var(--gold); font-weight: 700; font-size: 0.8rem; }

        .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tab-btn { background: var(--bg-panel); border: 1px solid var(--border); color: var(--muted); padding: 9px 12px; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); background: #132036; }

        .guardian-stats-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 12px;
        }
        .g-stat-card {
            background: #090d14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px;
        }
        .g-stat-card.tier-10 {
            border-color: var(--gold);
            background: linear-gradient(180deg, rgba(234,179,8,0.08), #090d14);
        }
        .g-stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 5px; }
        .g-stat-name { font-weight: 700; color: #e2e8f0; }
        .g-stat-tier { font-weight: 800; padding: 1px 6px; border-radius: 4px; font-size: 0.72rem; background: #1e293b; color: var(--accent); }
        .g-stat-card.tier-10 .g-stat-tier { background: var(--gold); color: #090c10; }
        .g-stat-segments { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 6px; margin-bottom: 4px; }
        .g-seg { background: #1e293b; border-radius: 1px; }
        .g-seg.filled { background: var(--accent); }
        .g-stat-card.tier-10 .g-seg.filled { background: var(--gold); }
        .g-stat-sub { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); }
        .waste-warn { color: #f97316; }

        .builds-bar {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .build-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .build-chip {
            background: #132036;
            border: 1px solid #283a5e;
            border-radius: 6px;
            padding: 5px 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        .build-chip b { color: var(--text); }
        .build-chip button { padding: 3px 8px; font-size: 0.72rem; }

        .postmaster-box {
            background: linear-gradient(90deg, #1e1b4b, #0f141d);
            border: 1px solid var(--purple);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }

        .status-bar {
            background: #0c1322;
            border-left: 3px solid var(--accent);
            padding: 7px 12px;
            font-size: 0.85rem;
            color: var(--accent);
            border-radius: 4px;
            margin-bottom: 14px;
        }

        /* --- TAGS SUR LES TUILES, INSPECTEUR ET COMPARATEUR --- */
        .tile-tag-badge {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 2px 6px rgba(0,0,0,0.75);
            pointer-events: none;
            z-index: 3;
        }
        .tag-selector-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }
        .tag-btn {
            background: #0c121e;
            border: 1px solid #26334d;
            color: #94a3b8;
            padding: 5px 4px;
            font-size: 0.68rem;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .tag-btn:hover { border-color: var(--accent); color: #fff; background: #132036; }
        .tag-btn.active-godroll { background: #422006; border-color: var(--gold); color: #fde047; }
        .tag-btn.active-keep { background: #0c4a6e; border-color: var(--accent); color: #bae6fd; }
        .tag-btn.active-infuse { background: #3b0764; border-color: var(--purple); color: #e9d5ff; }
        .tag-btn.active-junk { background: #450a0a; border-color: var(--red); color: #fecaca; }

        /* --- OPTIMISEUR D'ARMURES --- */
        .opt-controls {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .opt-top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .opt-stats-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .opt-stat-box {
            background: #090d14;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .opt-stat-box label { font-size: 0.8rem; font-weight: 700; color: #e2e8f0; }
        .opt-stat-box select { padding: 5px 8px; font-size: 0.8rem; min-width: 78px; }
        .opt-options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
        }
        .opt-check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #cbd5e1;
            cursor: pointer;
            user-select: none;
        }
        .opt-results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .opt-set-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 10px;
            padding: 14px 16px;
            display: grid;
            grid-template-columns: 1.25fr 1fr auto;
            gap: 16px;
            align-items: center;
        }
        .opt-set-card.perfect { border-left-color: var(--gold); }
        @media (max-width: 1080px) { .opt-set-card { grid-template-columns: 1fr; } }
        .opt-set-stats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        @media (max-width: 650px) { .opt-set-stats { grid-template-columns: repeat(3, 1fr); } }
        .opt-stat-pill {
            background: #090d14;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 5px 6px;
            text-align: center;
        }
        .opt-stat-pill.t10 { border-color: var(--gold); background: rgba(234,179,8,0.1); }
        .opt-stat-pill.target-ok { border-color: var(--green); }
        .opt-stat-pill small { display: block; font-size: 0.64rem; color: var(--muted); text-transform: uppercase; }
        .opt-stat-pill b { font-size: 0.88rem; color: var(--text); }
        .opt-stat-pill.t10 b { color: var(--gold); }
        .opt-mods-note {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #7dd3fc;
            background: #091322;
            border: 1px solid #1e3a5f;
            border-radius: 5px;
            padding: 5px 9px;
            display: inline-block;
        }

        /* --- VUE JALONS & ACTIVITÉS DE LA SEMAINE --- */
        .reset-banner {
            background: linear-gradient(90deg, #0f172a, #162238);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .reset-timer {
            background: #06090e;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.4px;
        }
        .milestone-group-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent);
            margin: 18px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .milestone-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .milestone-card.pinnacle { border-left-color: var(--gold); }
        .milestone-card.completed { opacity: 0.6; border-left-color: var(--green); }
        .milestone-icon {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            background: #090d14;
            border: 1px solid #26334d;
            flex-shrink: 0;
            padding: 3px;
        }
        .phases-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .phase-dot { width: 12px; height: 12px; border-radius: 3px; background: #1e293b; border: 1px solid #475569; }
        .phase-dot.done { background: var(--green); border-color: #86efac; }
        .milestone-obj { margin-top: 7px; font-size: 0.74rem; color: #cbd5e1; }
        .badge-pinnacle { background: #713f12; color: #fde047; border: 1px solid var(--gold); }
        .badge-powerful { background: #3b0764; color: #e9d5ff; border: 1px solid var(--purple); }
        .badge-done { background: #14532d; color: #86efac; }

        /* --- ESPACE ÉQUIPEMENT & COFFRE --- */
        .loadout-workspace {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 18px;
            align-items: start;
        }
        @media (max-width: 1150px) { .loadout-workspace { grid-template-columns: 1fr; } }
        .slots-column { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
        .slot-row {
            display: grid;
            grid-template-columns: 120px 310px 1fr;
            gap: 12px;
            align-items: stretch;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        @media (max-width: 780px) { .slot-row { grid-template-columns: 1fr; } }
        .slot-row:last-child { border-bottom: none; }
        .slot-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; align-items: center; }
        .drop-zone {
            min-height: 76px;
            background: var(--bg-slot);
            border: 1px dashed #26334d;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
            align-content: flex-start;
            transition: all 0.15s;
        }
        .drop-zone.equipped-zone { border: 1px solid #283650; background: #0b111c; padding: 8px 10px; align-items: center; }
        .drop-zone.drag-over { border-color: var(--gold) !important; background: rgba(234, 179, 8, 0.12) !important; }

        .bag-type-cluster {
            background: #0d131f;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 5px 7px 7px 7px;
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
        }
        .bag-type-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.3px; }
        .bag-type-tiles { display: flex; flex-wrap: wrap; gap: 6px; }

        .vault-type-group { margin-bottom: 10px; padding-left: 6px; border-left: 2px solid #1e293b; }
        .vault-type-label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
        .vault-type-label span { color: #475569; font-weight: 600; }

        .equipped-detail-card { width: 100%; cursor: grab; user-select: none; }
        .eq-top { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
        .eq-title { flex: 1; min-width: 0; }
        .eq-title h4 { margin: 0; font-size: 0.9rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .eq-title span { font-size: 0.72rem; color: var(--muted); }
        .eq-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
            background: #06090f;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid #192336;
        }
        .mini-stat { display: flex; align-items: center; justify-content: space-between; font-size: 0.7rem; gap: 6px; }
        .mini-stat-name { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-stat-bar-wrap { flex: 1; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; min-width: 28px; }
        .mini-stat-bar { height: 100%; background: var(--accent); }
        .mini-stat-val { font-weight: 700; color: var(--text); min-width: 20px; text-align: right; }
        .eq-perks { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .eq-perk-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #111927;
            border: 1px solid #26334d;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.66rem;
            color: #cbd5e1;
        }
        .eq-perk-chip img { width: 13px; height: 13px; border-radius: 50%; }

        .gear-tile {
            width: 58px;
            height: 58px;
            position: relative;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            border: 2px solid #475569;
            background: #000;
            transition: transform 0.12s, box-shadow 0.12s;
            flex-shrink: 0;
        }
        .gear-tile:hover { transform: translateY(-2px) scale(1.04); z-index: 5; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35); }
        .gear-tile.tier-Exotic { border-color: var(--gold); }
        .gear-tile.tier-Superior { border-color: var(--purple); }
        .gear-tile.tier-Rare { border-color: var(--blue); }
        .gear-tile.in-compare { box-shadow: 0 0 0 2px var(--accent), 0 0 12px rgba(56, 189, 248, 0.6); }
        .gear-tile img { width: 100%; height: 100%; border-radius: 4px; display: block; pointer-events: none; }
        .tile-power {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: rgba(7, 10, 14, 0.9);
            color: var(--text);
            font-size: 0.66rem;
            font-weight: 800;
            text-align: center;
            padding: 1px 0;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            pointer-events: none;
        }
        .gear-tile.tier-Exotic .tile-power { color: var(--gold); }
        .dupe-tag {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--gold);
            color: #090c10;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            pointer-events: none;
        }

        .vault-column {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            position: sticky;
            top: 16px;
            max-height: 86vh;
            overflow-y: auto;
        }
        .vault-column.drag-over {
            border-color: var(--gold) !important;
            background: rgba(234, 179, 8, 0.08) !important;
        }
        .vault-slot-group { margin-bottom: 16px; }
        .vault-slot-group h5 { margin: 0 0 8px 0; font-size: 0.8rem; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        #itemInspector {
            position: fixed;
            z-index: 9999;
            width: 375px;
            background: #0b0f17;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
            display: none;
            overflow: hidden;
            pointer-events: none;
        }
        #itemInspector.pinned { pointer-events: auto; border: 2px solid var(--gold); }
        .insp-banner { padding: 12px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .insp-banner.tier-Exotic { background: linear-gradient(135deg, #713f12, #1f1608); }
        .insp-banner.tier-Superior { background: linear-gradient(135deg, #4c1d95, #180c2e); }
        .insp-banner.tier-Rare { background: linear-gradient(135deg, #1e3a8a, #0c1938); }
        .insp-icon { width: 52px; height: 52px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); }
        .insp-title { flex: 1; min-width: 0; }
        .insp-title h3 { margin: 0; font-size: 1rem; color: #fff; }
        .insp-title small { color: #cbd5e1; font-size: 0.78rem; display: block; margin-top: 2px; }
        .insp-power { font-size: 1.15rem; font-weight: 800; color: var(--gold); }
        .insp-body { padding: 12px 14px; }
        .insp-flavor { font-style: italic; font-size: 0.76rem; color: #94a3b8; margin: 0 0 10px 0; }

    <script>
        const DEFAULT_API_KEY = "b5ca5b2b28314f6785135d45d6a5e981";
        const DEFAULT_CLIENT_ID = "56923";

        const BUCKET_POSTMASTER = 215593132;
        const SLOTS_DESTINY = [
            { hash: 1498876634, nom: "Arme Cinétique", type: "weapon" },
            { hash: 2465295065, nom: "Arme Énergétique", type: "weapon" },
            { hash: 953998645,  nom: "Arme Puissante", type: "weapon" },
            { hash: 3448274439, nom: "Casque", type: "armor" },
            { hash: 3551918588, nom: "Gantelets", type: "armor" },
            { hash: 14239492,   nom: "Armure de Torse", type: "armor" },
            { hash: 20886954,   nom: "Armure de Jambes", type: "armor" },
            { hash: 1585787867, nom: "Objet de Classe", type: "armor" }
        ];
        const BUCKETS_CONNUS = new Set(SLOTS_DESTINY.map(s => s.hash));
        const ARMOR_SLOTS_4 = [3448274439, 3551918588, 14239492, 20886954];
        const BUCKET_CLASS_ITEM = 1585787867;

        const TAGS_CONFIG = {
            godroll: { id: 'godroll', icon: '⭐', label: 'God Roll',    bg: '#422006', border: '#eab308' },
            keep:    { id: 'keep',    icon: '🔒', label: 'À garder',    bg: '#0c4a6e', border: '#38bdf8' },
            infuse:  { id: 'infuse',  icon: '⚡', label: 'Infuser',     bg: '#3b0764', border: '#a855f7' },
            junk:    { id: 'junk',    icon: '🗑️', label: 'Démanteler',  bg: '#450a0a', border: '#ef4444' }
        };

        const STATS_ARMES_ORDRE = [
            4043523819, 1240592695, 155624089, 943549884,
            4188031367, 4284893193, 2961396640, 447667954, 3871231066
        ];
        const STATS_BAS_MEILLEUR = new Set([2961396640, 447667954]);

        const STATS_GARDIEN_6 = [
            { hash: 2996146975, nom: "Mobilité",     court: "Mob" },
            { hash: 392767087,  nom: "Résistance",   court: "Rés" },
            { hash: 1943323491, nom: "Récupération", court: "Réc" },
            { hash: 1735777505, nom: "Discipline",   court: "Dis" },
            { hash: 144602215,  nom: "Intelligence", court: "Int" },
            { hash: 4244567218, nom: "Force",        court: "For" }
        ];
        const STATS_ARMURES_ORDRE = STATS_GARDIEN_6.map(s => s.hash);
        const classesNom = { 0: 'Titan', 1: 'Chasseur', 2: 'Arcaniste' };

        let ongletActif = 'loadout';
        let filtreDoublonsActif = false;
        let joueurInfo = null;
        let persoActifId = null;
        let dictGlobal = {};
        let mapPersos = {};
        let listeCoffre = [];
        let compteDoublons = {};
        let listeCrafting = [];
        let listeCatalyseurs = [];
        let groupesMarchands = {};
        let listeQuetes = [];
        let listeExotiques = [];
        let listeTriomphes = [];
        let registreObjets = {};
        let comparateurKeys = [];
        let itemTags = {};
        let objetGlisse = null;
        let inspecteurVerrouille = false;
        let inspecteurUkeyActif = null;

        // État de l'Optimiseur d'armures
        let optState = {
            exotic: 'any',
            targets: [0, 10, 0, 10, 0, 0], // Défaut : Résistance T10, Discipline T10
            assumeMW: true,
            useMods: true,
            ignoreJunk: true,
            results: [],
            meta: null
        };

        window.onload = async () => {
            localStorage.setItem('d2_apiKey', DEFAULT_API_KEY);
            localStorage.setItem('d2_clientId', DEFAULT_CLIENT_ID);
            chargerTagsLocale();

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('bungieName')) localStorage.setItem('d2_bungieName', urlParams.get('bungieName'));

            if (localStorage.getItem('d2_bungieName')) {
                document.getElementById('bungieName').value = localStorage.getItem('d2_bungieName');
            }

            document.addEventListener('click', (e) => {
                const insp = document.getElementById('itemInspector');
                if (inspecteurVerrouille && !insp.contains(e.target) && !e.target.closest('[data-ukey]')) {
                    fermerInspecteur(true);
                }
            });

            if (urlParams.get('code')) {
                const code = urlParams.get('code');
                window.history.replaceState({}, document.title, window.location.pathname);
                await echangerCodeOAuth(code);
                return;
            }

            if (localStorage.getItem('d2_accessToken') || localStorage.getItem('d2_refreshToken') || localStorage.getItem('d2_bungieName')) {
                lancerAnalyse();
            }
        };

        // =========================================================================
        // GESTION DES TAGS / FAVORIS
        // =========================================================================
        function chargerTagsLocale() {
            try { itemTags = JSON.parse(localStorage.getItem('d2_itemTags') || '{}'); }
            catch { itemTags = {}; }
        }

        function sauvegarderTagsLocale() {
            localStorage.setItem('d2_itemTags', JSON.stringify(itemTags));
        }

        function obtenirTag(item) {
            if (!item || !item.itemInstanceId) return null;
            return itemTags[item.itemInstanceId] || null;
        }

        function definirTag(itemInstanceId, tagId) {
            if (!itemInstanceId) return;
            if (itemTags[itemInstanceId] === tagId) {
                delete itemTags[itemInstanceId];
            } else {
                itemTags[itemInstanceId] = tagId;
            }
            sauvegarderTagsLocale();
            mettreAJourOptionsTags();
            afficherVue();
            mettreAJourComparateurUI();
            if (inspecteurVerrouille && inspecteurUkeyActif && registreObjets[inspecteurUkeyActif]) {
                rendreContenuInspecteur(registreObjets[inspecteurUkeyActif]);
            }
        }

        function mettreAJourOptionsTags() {
            const comptes = { godroll: 0, keep: 0, infuse: 0, junk: 0 };
            Object.values(registreObjets).forEach(obj => {
                if (obj.itemInstanceId && itemTags[obj.itemInstanceId]) {
                    const t = itemTags[obj.itemInstanceId];
                    if (comptes[t] !== undefined) comptes[t]++;
                }
            });
            const sel = document.getElementById('filtreTag');
            const valActuelle = sel.value;
            sel.innerHTML = `
                <option value="all">Tag : Tous</option>
                <option value="godroll">⭐ God Roll (${comptes.godroll})</option>
                <option value="keep">🔒 À garder (${comptes.keep})</option>
                <option value="infuse">⚡ À infuser (${comptes.infuse})</option>
                <option value="junk">🗑️ À démanteler (${comptes.junk})</option>
                <option value="untagged">Sans tag</option>
            `;
            sel.value = valActuelle;

            const junkDansCoffre = listeCoffre.filter(i => obtenirTag(i) === 'junk').length;
            const btnPull = document.getElementById('btnPullJunk');
            btnPull.style.display = (ongletActif === 'loadout' && junkDansCoffre > 0 && (valActuelle === 'junk' || valActuelle === 'all')) ? 'inline-block' : 'none';
            btnPull.textContent = `🎒 Rapatrier ${junkDansCoffre} 🗑️ du Coffre`;
        }

        async function rapatrierObjetsADemanteler() {
            const junkVault = listeCoffre.filter(i => obtenirTag(i) === 'junk');
            if (junkVault.length === 0 || !persoActifId || !joueurInfo) return;
            const nomPerso = mapPersos[persoActifId]?.classeNom || 'Perso';
            let ok = 0;

            try {
                for (const item of junkVault) {
                    setStatus(`Rapatriement des objets à démanteler vers ${nomPerso} (${ok + 1}/${junkVault.length})...`);
                    const res = await appelActionBungie('TransferItem', {
                        itemReferenceHash: item.itemHash,
                        stackSize: 1,
                        transferToVault: false,
                        itemId: item.itemInstanceId,
                        characterId: persoActifId,
                        membershipType: joueurInfo.membershipType
                    });
                    if (res.ErrorCode === 1) ok++;
                }
                setStatus(`${ok} objet(s) "À démanteler" transférés dans le Sac de ton ${nomPerso} !`);
                await lancerAnalyse();
            } catch (e) {
                setStatus(`Rapatriement interrompu (${ok} transférés) : ${e.message}`);
                await lancerAnalyse();
            }
        }

        function basculerConfig() { document.getElementById('configDrawer').classList.toggle('open'); }
        function setStatus(msg) { document.getElementById('statusText').textContent = msg; }

        function basculerFiltreDoublons() {
            filtreDoublonsActif = !filtreDoublonsActif;
            document.getElementById('btnFiltreDoublons').classList.toggle('active', filtreDoublonsActif);
            afficherVue();
        }

        function enregistrerConfig() {
            const b = document.getElementById('bungieName').value.trim();

        async function echangerCodeOAuth(codeRecu) {
            if (!codeRecu) return;
            try {
                setStatus("Connexion OAuth à Bungie.net en cours...");
                const resp = await fetch('https://www.bungie.net/Platform/App/OAuth/Token/', {
                    method: 'POST',

                });

                if (data.access_token) {

        function sauvegarderTokens(data) {
            localStorage.setItem('d2_accessToken', data.access_token);
            if (data.refresh_token) localStorage.setItem('d2_refreshToken', data.refresh_token);
            localStorage.setItem('d2_tokenExpiry', Date.now() + (data.expires_in * 1000) - 60000);
        }

        async function obtenirTokenValide() {
            const token = localStorage.getItem('d2_accessToken');
            const expiry = parseInt(localStorage.getItem('d2_tokenExpiry') || '0');
            const refresh = localStorage.getItem('d2_refreshToken');

            if (token && Date.now() < expiry) return token;
            if (refresh) {
                try {
                    const resp = await fetch('https://www.bungie.net/Platform/App/OAuth/Token/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-API-Key': DEFAULT_API_KEY },
                        body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refresh, client_id: DEFAULT_CLIENT_ID })
                    });
                    const data = await resp.json();
                    if (data.access_token) {
                        sauvegarderTokens(data);
                        return data.access_token;
                    }
                } catch (e) { console.warn(e); }
            }
            if (token && Date.now() >= expiry) {
                localStorage.removeItem('d2_accessToken');
                return null;
            }
            return token;
        }

        async function identifierJoueur(accessToken) {
            if (accessToken) {
                const resp = await fetch('https://www.bungie.net/Platform/User/GetMembershipsForCurrentUser/', {
                    headers: { 'X-API-Key': DEFAULT_API_KEY, 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await resp.json();
                const memberships = data.Response?.destinyMemberships || [];
                if (memberships.length > 0) {
                    const primaryId = data.Response.primaryMembershipId;
                    return memberships.find(x => x.membershipId === primaryId)
                        || memberships.find(x => x.applicableMembershipTypes && x.applicableMembershipTypes.length > 0)
                        || memberships[0];
                }
            }
            const fullBungieName = document.getElementById('bungieName').value.trim();
            if (!fullBungieName.includes('#')) throw new Error("Clique sur 'Se connecter avec Bungie.net' en haut à droite.");
            const [displayName, displayNameCode] = fullBungieName.split('#');
            const searchResp = await fetch('https://www.bungie.net/Platform/Destiny2/SearchDestinyPlayerByBungieName/-1/', {
                method: 'POST',
                headers: { 'X-API-Key': DEFAULT_API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ displayName, displayNameCode: parseInt(displayNameCode) })
            });
            const searchData = await searchResp.json();
            return searchData.Response[0];
        }

        function calculerCompteAReboursReset() {
            const now = new Date();
            const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 17, 0, 0, 0));
            const day = now.getUTCDay();
            let joursRestants = (2 - day + 7) % 7;
            if (joursRestants === 0 && now.getTime() >= target.getTime()) joursRestants = 7;
            target.setUTCDate(target.getUTCDate() + joursRestants);
            const diffMs = Math.max(0, target.getTime() - now.getTime());
            const d = Math.floor(diffMs / 86400000);
            const h = Math.floor((diffMs % 86400000) / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);
            return `${d}j ${h}h ${m}m`;
        }

        function extrairePerksDetails(instanceId, itemPerks) {
            const liste = [];
            if (instanceId && itemPerks[instanceId]?.perks && dictGlobal.perks) {
                const dejaVu = new Set();
                itemPerks[instanceId].perks.forEach(p => {
                    const pDef = dictGlobal.perks[p.perkHash];
                    if (p.visible && pDef?.displayProperties?.name && !dejaVu.has(pDef.displayProperties.name) && liste.length < 6) {
                        dejaVu.add(pDef.displayProperties.name);
                        liste.push({
                            nom: pDef.displayProperties.name,
                            desc: pDef.displayProperties.description || "",
                            icone: pDef.displayProperties.icon ? 'https://www.bungie.net' + pDef.displayProperties.icon : ''
                        });
                    }
                });
            }
            return liste;
        }

        function extraireStatsObjet(def, instanceId, itemStatsMap) {
            const estArme = def.itemType === 3;
            const ordreCible = estArme ? STATS_ARMES_ORDRE : STATS_ARMURES_ORDRE;
            const liveStats = (instanceId && itemStatsMap && itemStatsMap[instanceId]?.stats) ? itemStatsMap[instanceId].stats : {};
            const baseStats = def.stats?.stats || {};

            const resultat = [];
            let totalArmure = 0;

            ordreCible.forEach(statHash => {
                const val = liveStats[statHash]?.value ?? baseStats[statHash]?.value;
                const sDef = dictGlobal.stats?.[statHash];
                if (val !== undefined && val > 0 && sDef?.displayProperties?.name) {
                    const nomCourt = sDef.displayProperties.name
                        .replace('Vitesse de rechargement', 'Rechargement')
                        .replace('Coups par minute', 'Cadence (CPM)');
                    resultat.push({
                        hash: statHash,
                        nom: nomCourt,
                        val: val,
                        isBar: ![4284893193, 3871231066, 2961396640, 447667954].includes(statHash)
                    });
                    if (!estArme) totalArmure += val;
                }
            });

            if (!estArme && totalArmure > 0) {
                resultat.push({ hash: 0, nom: "Total des stats", val: totalArmure, isBar: false, isTotal: true });
            }
            return resultat;
        }

        function extraireVecteur6Armure(def, instanceId, itemStatsMap) {
            if (def.itemType !== 2) return null;
            const liveStats = (instanceId && itemStatsMap && itemStatsMap[instanceId]?.stats) ? itemStatsMap[instanceId].stats : {};
            const baseStats = def.stats?.stats || {};
            return STATS_ARMURES_ORDRE.map(h => liveStats[h]?.value ?? baseStats[h]?.value ?? 0);
        }

        function formaterEquipement(item, lieuType, charIdOwner, instances, itemPerks, itemStatsMap, forcePostmaster = false) {
            const def = dictGlobal.items[item.itemHash];
            if (!def || !def.displayProperties?.name) return null;
            const bucketHash = def.inventory?.bucketTypeHash;
            if (!forcePostmaster && !BUCKETS_CONNUS.has(bucketHash)) return null;

            const instanceId = item.itemInstanceId;
            const inst = instanceId ? instances[instanceId] : null;
            const power = inst?.primaryStat?.value ? inst.primaryStat.value : null;
            const isMasterwork = ((item.state || 0) & 4) !== 0;
            const tierKey = def.inventory?.tierType === 6 ? 'Exotic' : (def.inventory?.tierType === 5 ? 'Superior' : 'Rare');
            const perks = extrairePerksDetails(instanceId, itemPerks);
            const stats = extraireStatsObjet(def, instanceId, itemStatsMap);
            const armorStats6 = extraireVecteur6Armure(def, instanceId, itemStatsMap);
            const ukey = instanceId || ('hash_' + item.itemHash + '_' + Math.random().toString(36).substring(2, 7));

            const obj = {
                ukey,
                nom: def.displayProperties.name,
                typeNom: def.itemTypeDisplayName || 'Équipement',
                flavor: def.flavorText || "",
                itemHash: item.itemHash,
                itemInstanceId: instanceId,
                stackSize: item.quantity || 1,
                bucketHash: bucketHash,
                classType: def.classType, // 0 Titan, 1 Chasseur, 2 Arcaniste, 3 Tous
                isMasterwork: isMasterwork,
                lieuType: lieuType,
                charIdOwner: charIdOwner,
                icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : '',
                power: power,
                perks: perks,
                stats: stats,
                armorStats6: armorStats6,
                categorie: def.itemType === 3 ? 'weapon' : 'armor',
                tier: tierKey
            };
            registreObjets[ukey] = obj;
            return obj;
        }

        function collecterRecordsDansNoeud(nodeHash, visited = new Set()) {
            const res = [];
            if (!nodeHash || visited.has(nodeHash)) return res;
            visited.add(nodeHash);
            const node = dictGlobal.nodes?.[nodeHash];
            if (!node) return res;
            (node.children?.records || []).forEach(r => res.push(r.recordHash));
            (node.children?.presentationNodes || []).forEach(child => {
                res.push(...collecterRecordsDansNoeud(child.presentationNodeHash, visited));
            });
            return res;
        }

        function extraireJalonsPerso(milestonesData) {
            const jalons = [];
            if (!milestonesData || !dictGlobal.milestones) return jalons;

            const motsRaidDonjon = [
                'raid', 'donjon', 'caveau', 'chute du roi', 'serment', 'racine', 'cropta',
                'bord du salut', 'dualisme', 'flèche', 'fantômes', 'ruine', 'hôte', 'vesper',
                'doctrine', 'prophétie', 'fosse', 'trône brisé', 'emprise', 'dernier vœu', 'jardin', 'crypte'
            ];
            const motsRituels = ['nuit noire', 'avant-garde', 'épreuve', 'gambit', 'jugement', 'bannière', 'assaut', 'osiris', 'compétitif'];

            for (const [mHash, mLive] of Object.entries(milestonesData)) {
                const mDef = dictGlobal.milestones[mHash];
                if (!mDef || !mDef.displayProperties?.name) continue;

                const nomJalon = mDef.displayProperties.name;
                let descJalon = mDef.displayProperties.description || "";
                let icone = mDef.displayProperties.icon ? 'https://www.bungie.net' + mDef.displayProperties.icon : '';

                let recompenseLabel = "";
                if (mDef.rewards) {
                    for (const rCat of Object.values(mDef.rewards)) {
                        for (const entry of Object.values(rCat.rewardEntries || {})) {
                            const rName = entry.displayProperties?.name || "";
                            if (rName) { recompenseLabel = rName; break; }
                        }
                        if (recompenseLabel) break;
                    }
                }

                const objectifs = [];
                const objVus = new Set();
                let phases = [];
                let nomActiviteAssociee = "";

                if (mLive.availableQuests) {
                    mLive.availableQuests.forEach(q => {
                        (q.status?.stepObjectives || []).forEach(o => {
                            if (objVus.has(o.objectiveHash)) return;
                            objVus.add(o.objectiveHash);
                            const oDef = dictGlobal.objectives?.[o.objectiveHash];
                            objectifs.push({
                                texte: oDef?.progressDescription || "Objectif hebdomadaire",
                                progress: o.progress || 0,
                                max: o.completionValue || 1,
                                complete: !!o.complete
                            });
                        });
                    });
                }

                if (mLive.activities) {
                    mLive.activities.forEach(act => {
                        const actDef = dictGlobal.activities?.[act.activityHash];
                        if (actDef?.displayProperties?.name && !nomActiviteAssociee) nomActiviteAssociee = actDef.displayProperties.name;
                        if (!icone && actDef?.displayProperties?.icon) icone = 'https://www.bungie.net' + actDef.displayProperties.icon;
                        if (act.phases && act.phases.length > phases.length) phases = act.phases.map(ph => ({ complete: !!ph.complete }));
                        (act.challenges || []).forEach(ch => {
                            const o = ch.objective;
                            if (!o || objVus.has(o.objectiveHash)) return;
                            objVus.add(o.objectiveHash);
                            const oDef = dictGlobal.objectives?.[o.objectiveHash];
                            objectifs.push({
                                texte: oDef?.progressDescription || "Défi hebdomadaire",
                                progress: o.progress || 0,
                                max: o.completionValue || 1,
                                complete: !!o.complete
                            });
                        });
                    });
                }

                let rewardEntriesLive = [];
                if (mLive.rewards) mLive.rewards.forEach(r => (r.entries || []).forEach(e => rewardEntriesLive.push(e)));
                if (objectifs.length === 0 && phases.length === 0 && rewardEntriesLive.length === 0) continue;

                let complete = false;
                if (objectifs.length > 0) complete = objectifs.every(o => o.complete);
                else if (phases.length > 0) complete = phases.every(p => p.complete);
                else if (rewardEntriesLive.length > 0) complete = rewardEntriesLive.every(e => e.earned || e.redeemed);

                const texteRecherche = `${nomJalon} ${descJalon} ${nomActiviteAssociee}`.toLowerCase();
                let groupe = 'weekly';
                if (phases.length > 0 || motsRaidDonjon.some(m => texteRecherche.includes(m))) groupe = 'raid_dungeon';
                else if (motsRituels.some(m => texteRecherche.includes(m))) groupe = 'ritual';

                const estPrestige = `${recompenseLabel} ${descJalon}`.toLowerCase().includes('prestige') || `${recompenseLabel} ${descJalon}`.toLowerCase().includes('pinnacle');
                const estPuissant = `${recompenseLabel} ${descJalon}`.toLowerCase().includes('puissant') || `${recompenseLabel} ${descJalon}`.toLowerCase().includes('powerful');

                jalons.push({
                    nom: nomJalon,
                    sousTitre: nomActiviteAssociee && nomActiviteAssociee !== nomJalon ? nomActiviteAssociee : descJalon,
                    desc: descJalon,
                    icone: icone || 'https://www.bungie.net/img/misc/missing_icon_d2.png',
                    recompense: recompenseLabel || (estPrestige ? 'Équipement de prestige' : (estPuissant ? 'Équipement puissant' : 'Récompense hebdomadaire')),
                    estPrestige,
                    estPuissant,
                    groupe,
                    objectifs,
                    phases,
                    possede: complete
                });
            }

            jalons.sort((a, b) => {
                if (a.possede !== b.possede) return a.possede ? 1 : -1;
                if (a.estPrestige !== b.estPrestige) return a.estPrestige ? -1 : 1;
                return a.nom.localeCompare(b.nom);
            });
            return jalons;
        }

                            flavor: descRec,
                            source: descRec || "Catalyseur d'arme exotique",
                            icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : 'https://www.bungie.net/img/misc/missing_icon_d2.png',
                            possede: complete,
                            enCours: enCours,
                            progActuel: prog,
                            progMax: max,
                            categorie: 'weapon',
                            tier: 'Exotic',
                            badgeTexte: complete ? '✓ Complété' : (enCours ? `⚡ En cours (${prog} / ${max})` : '🔒 Manquant / Non commencé'),
                            stats: [],
                            perks: []
                        };
                        registreObjets[ukey] = objCat;
                        listeCatalyseurs.push(objCat);
                        continue;
                    }

                    const armeMatch = mapArmesParNom[nomRec];
                    const objZero = rec.objectives && rec.objectives.length > 0 ? rec.objectives[0] : null;
                    const estModeleArme = armeMatch && objZero && objZero.completionValue >= 1 && objZero.completionValue <= 5 && !nomsCraftingVus.has(nomRec);

                    if (estModeleArme) {
                        nomsCraftingVus.add(nomRec);
                        const prog = objZero.progress || 0;
                        const max = objZero.completionValue || 5;
                        const ukey = 'craft_' + hash;
                        const objCraft = {
                            ukey,
                            nom: nomRec,
                            typeNom: armeMatch.itemTypeDisplayName || "Arme façonnable",
                            flavor: armeMatch.flavorText || "",
                            source: `${armeMatch.itemTypeDisplayName || 'Arme'} — ${prog} / ${max} bordures rouges`,
                            icone: 'https://www.bungie.net' + armeMatch.displayProperties.icon,
                            possede: complete,
                            progActuel: prog,
                            progMax: max,
                            categorie: 'weapon',
                            tier: armeMatch.inventory?.tierType === 6 ? 'Exotic' : 'Superior',
                            badgeTexte: complete ? '✓ Modèle Débloqué' : `🟥 ${prog} / ${max} Souvenirs`,
                            stats: extraireStatsObjet(armeMatch, null, null),
                            perks: []
                        };
                        registreObjets[ukey] = objCraft;
                        listeCrafting.push(objCraft);
                    } else {
                        listeTriomphes.push({
                            nom: nomRec,
                            source: descRec || "Triomphe",
                            icone: def.displayProperties.icon ? 'https://www.bungie.net' + def.displayProperties.icon : 'https://www.bungie.net/img/misc/missing_icon_d2.png',
                            possede: complete,
                            categorie: 'triumph',
                            tier: complete ? 'Exotic' : 'Rare',
                            badgeTexte: complete ? 'Complété' : 'À faire'
                        });
                    }
                }

                listeCrafting.sort((a, b) => {
                    if (a.possede !== b.possede) return a.possede ? 1 : -1;
                    return (b.progActuel / b.progMax) - (a.progActuel / a.progMax);
                });

                listeCatalyseurs.sort((a, b) => {
                    const score = (x) => x.enCours ? 0 : (!x.possede ? 1 : 2);
                    if (score(a) !== score(b)) return score(a) - score(b);
                    return (b.progActuel / b.progMax) - (a.progActuel / a.progMax);
                });

                comparateurKeys = comparateurKeys.filter(k => registreObjets[k]);
                mettreAJourComparateurUI();
                mettreAJourOptionsTags();
                mettreAJourCompteurJalons();

                document.getElementById('count-crafting').textContent = listeCrafting.length;
                document.getElementById('count-catalysts').textContent = listeCatalyseurs.length;
                document.getElementById('count-quests').textContent = listeQuetes.length;
                document.getElementById('count-exotics').textContent = listeExotiques.length;
                document.getElementById('count-triumphs').textContent = listeTriomphes.length;

                if (!resp.profileInventory?.data) {
                    setStatus("⚠️ Clique sur 'Se connecter avec Bungie.net' en haut à droite pour accéder au Coffre.");
                } else {
                    const jalonsRestants = (mapPersos[persoActifId]?.milestones || []).filter(m => !m.possede).length;
                    setStatus(`Synchronisé à ${new Date().toLocaleTimeString()} — ${listeCoffre.length} objets au Coffre • ${jalonsRestants} jalons restants sur ton ${mapPersos[persoActifId]?.classeNom}.`);
                }

                if (ongletActif === 'vendors') {
                    chargerMarchandsPerso(persoActifId);
                } else {
                    if (ongletActif === 'optimizer') calculerOptimisationArmures(false);
                    afficherVue();
                }

            } catch (err) {
                setStatus("Info : " + err.message);
            }
        }

        // =========================================================================
        // OPTIMISEUR D'ARMURES (DOUBLE / TRIPLE 100)
        // =========================================================================
        function collecterArmuresClasseActive() {
            const p = mapPersos[persoActifId];
            if (!p) return [];
            const tous = [];
            Object.values(mapPersos).forEach(ch => {
                tous.push(...ch.equipped, ...ch.inventory);
            });
            tous.push(...listeCoffre);
            return tous.filter(i =>
                i.categorie === 'armor' &&
                i.itemInstanceId &&
                i.classType === p.classType &&
                (i.tier === 'Exotic' || i.tier === 'Superior')
            );
        }

        function appliquerPresetOptimiseur(preset) {
            if (preset === 'triple_pve') optState.targets = [0, 10, 10, 10, 0, 0];
            else if (preset === 'res_dis') optState.targets = [0, 10, 0, 10, 0, 0];
            else if (preset === 'pvp_mob') optState.targets = [10, 7, 10, 0, 0, 0];
            else optState.targets = [0, 0, 0, 0, 0, 0];
            calculerOptimisationArmures(true);
        }

        function majParamOptimiseur() {
            const selExo = document.getElementById('optExotic');
            if (selExo) optState.exotic = selExo.value;
            for (let i = 0; i < 6; i++) {
                const el = document.getElementById('optStat_' + i);
                if (el) optState.targets[i] = parseInt(el.value, 10) || 0;
            }
            const cbMW = document.getElementById('optAssumeMW');
            const cbMods = document.getElementById('optUseMods');
            const cbJunk = document.getElementById('optIgnoreJunk');
            if (cbMW) optState.assumeMW = cbMW.checked;
            if (cbMods) optState.useMods = cbMods.checked;
            if (cbJunk) optState.ignoreJunk = cbJunk.checked;
            calculerOptimisationArmures(true);
        }

        function calculerOptimisationArmures(rerender = true) {
            const t0 = performance.now();
            const armures = collecterArmuresClasseActive().filter(a => {
                if (optState.ignoreJunk && obtenirTag(a) === 'junk') return false;
                return true;
            });

            // Meilleur objet de classe disponible (MW prioritaire)
            const classItems = armures.filter(a => a.bucketHash === BUCKET_CLASS_ITEM);
            classItems.sort((a, b) => (b.isMasterwork ? 1 : 0) - (a.isMasterwork ? 1 : 0) || (b.power || 0) - (a.power || 0));
            const bestClassItem = classItems[0] || null;
            const bonusClassItem = (bestClassItem && (bestClassItem.isMasterwork || optState.assumeMW)) ? 2 : 0;

            const exoChoisi = optState.exotic; // 'any', 'none', ou itemHash en string
            let exoBucketVerrouille = null;
            if (exoChoisi !== 'any' && exoChoisi !== 'none') {
                const sampleExo = armures.find(a => String(a.itemHash) === exoChoisi);
                if (sampleExo) exoBucketVerrouille = sampleExo.bucketHash;
            }

            const targetsPts = optState.targets.map(t => t * 10);
            const maxMods = optState.useMods ? 5 : 0;

            // Préparation et filtrage intelligent (Top 16 par emplacement pour une vitesse instantanée)
            const pools = ARMOR_SLOTS_4.map(bHash => {
                let candidates = armures.filter(a => a.bucketHash === bHash && a.armorStats6);

                if (exoChoisi === 'none') {
                    candidates = candidates.filter(a => a.tier !== 'Exotic');
                } else if (exoBucketVerrouille !== null) {
                    if (bHash === exoBucketVerrouille) {
                        candidates = candidates.filter(a => String(a.itemHash) === exoChoisi);
                    } else {
                        candidates = candidates.filter(a => a.tier !== 'Exotic');
                    }
                }

                // Pré-calcul du vecteur de stats effectif (avec bonus MW si coché)
                const enriched = candidates.map(a => {
                    const addMW = (optState.assumeMW && !a.isMasterwork) ? 2 : 0;
                    const vec = a.armorStats6.map(v => v + addMW);
                    let scoreHeuristique = 0;
                    for (let i = 0; i < 6; i++) {
                        scoreHeuristique += vec[i] * (optState.targets[i] > 0 ? (2 + optState.targets[i] * 0.25) : 0.7);
                    }
                    return { item: a, vec, isExo: a.tier === 'Exotic', scoreHeuristique };
                });

                enriched.sort((a, b) => b.scoreHeuristique - a.scoreHeuristique);
                // Garder les 16 meilleurs + tous les exotiques si en mode 'any' (plafonné à 20)
                if (enriched.length > 16) {
                    const top = enriched.slice(0, 14);
                    const exos = enriched.slice(14).filter(e => e.isExo).slice(0, 4);
                    return [...top, ...exos];
                }
                return enriched;
            });

            if (pools.some(p => p.length === 0)) {
                optState.results = [];
                optState.meta = { totalTested: 0, validCount: 0, ms: Math.round(performance.now() - t0), missingSlot: true };
                if (rerender) afficherVue();
                return;
            }

            // Ordre de priorité des stats pour placer les mods restants
            const ordrePriorite = [0, 1, 2, 3, 4, 5].sort((a, b) => optState.targets[b] - optState.targets[a]);

            let tested = 0;
            let exactMatches = [];
            let fallbackMatches = [];

            const [p0, p1, p2, p3] = pools;
            for (let i0 = 0; i0 < p0.length; i0++) {
                const a0 = p0[i0];
                for (let i1 = 0; i1 < p1.length; i1++) {
                    const a1 = p1[i1];
                    const exo01 = (a0.isExo ? 1 : 0) + (a1.isExo ? 1 : 0);
                    if (exo01 > 1) continue;

                    for (let i2 = 0; i2 < p2.length; i2++) {
                        const a2 = p2[i2];
                        const exo012 = exo01 + (a2.isExo ? 1 : 0);
                        if (exo012 > 1) continue;

                        for (let i3 = 0; i3 < p3.length; i3++) {
                            const a3 = p3[i3];
                            if (exo012 + (a3.isExo ? 1 : 0) > 1) continue;
                            tested++;

                            const base = [
                                a0.vec[0] + a1.vec[0] + a2.vec[0] + a3.vec[0] + bonusClassItem,
                                a0.vec[1] + a1.vec[1] + a2.vec[1] + a3.vec[1] + bonusClassItem,
                                a0.vec[2] + a1.vec[2] + a2.vec[2] + a3.vec[2] + bonusClassItem,
                                a0.vec[3] + a1.vec[3] + a2.vec[3] + a3.vec[3] + bonusClassItem,
                                a0.vec[4] + a1.vec[4] + a2.vec[4] + a3.vec[4] + bonusClassItem,
                                a0.vec[5] + a1.vec[5] + a2.vec[5] + a3.vec[5] + bonusClassItem
                            ];

                            // Calcul des mods nécessaires pour atteindre les cibles
                            let modsUsed = 0;
                            let deficitRestant = 0;
                            const modsParStat = [0, 0, 0, 0, 0, 0]; // en points ajoutés (+5 ou +10 par slot)
                            const modsDetail = [];

                            for (let s = 0; s < 6; s++) {
                                const def = targetsPts[s] - base[s];
                                if (def > 0) {
                                    const slotsReq = Math.ceil(def / 10);
                                    modsUsed += slotsReq;
                                    const ptsAjoutes = (def % 10 > 0 && def % 10 <= 5) ? ((slotsReq - 1) * 10 + 5) : (slotsReq * 10);
                                    modsParStat[s] = ptsAjoutes;
                                }
                            }

                            const respecteCibles = modsUsed <= maxMods;

                            // Copie des stats finales
                            const finalStats = base.slice();
                            if (respecteCibles) {
                                for (let s = 0; s < 6; s++) {
                                    if (modsParStat[s] > 0) {
                                        finalStats[s] += modsParStat[s];
                                        const maj = Math.floor(modsParStat[s] / 10);
                                        const min = (modsParStat[s] % 10) === 5 ? 1 : 0;
                                        if (maj > 0) modsDetail.push(`${maj}× +10 ${STATS_GARDIEN_6[s].nom}`);
                                        if (min > 0) modsDetail.push(`1× +5 ${STATS_GARDIEN_6[s].nom}`);
                                    }
                                }
                                // Utiliser les emplacements de mods restants pour pousser les paliers utiles
                                let restants = maxMods - modsUsed;
                                while (restants > 0) {
                                    // Chercher la stat la plus rentable à booster (+10 sous 100)
                                    let bestS = -1;
                                    for (const s of ordrePriorite) {
                                        if (finalStats[s] < 100) { bestS = s; break; }
                                    }
                                    if (bestS === -1) break;
                                    const needTo100 = 100 - finalStats[bestS];
                                    const gain = needTo100 <= 5 ? 5 : 10;
                                    finalStats[bestS] += gain;
                                    modsDetail.push(`1× +${gain} ${STATS_GARDIEN_6[bestS].nom}`);
                                    restants--;
                                }
                            } else {
                                // Calculer à quel point on est proche si aucun ensemble parfait
                                for (let s = 0; s < 6; s++) {
                                    const def = targetsPts[s] - base[s];
                                    if (def > 0) deficitRestant += def;
                                }
                            }

                            let totalTiers = 0;
                            let wasted = 0;
                            for (let s = 0; s < 6; s++) {
                                const v = finalStats[s];
                                const t = Math.min(10, Math.floor(v / 10));
                                totalTiers += t;
                                wasted += v >= 100 ? (v - 100) : (v % 10);
                            }

                            const entry = {
                                pieces: [a0.item, a1.item, a2.item, a3.item, bestClassItem].filter(Boolean),
                                finalStats,
                                totalTiers,
                                wasted,
                                modsUsed,
                                modsDetail,
                                exact: respecteCibles,
                                score: respecteCibles
                                    ? (totalTiers * 10000 - modsUsed * 200 - wasted * 5)
                                    : (-deficitRestant * 1000 + totalTiers * 100 - wasted)
                            };

                            if (respecteCibles) {
                                if (exactMatches.length < 15) {
                                    exactMatches.push(entry);
                                    exactMatches.sort((a, b) => b.score - a.score);
                                } else if (entry.score > exactMatches[exactMatches.length - 1].score) {
                                    exactMatches[exactMatches.length - 1] = entry;
                                    exactMatches.sort((a, b) => b.score - a.score);
                                }
                            } else if (exactMatches.length === 0) {
                                if (fallbackMatches.length < 10) {
                                    fallbackMatches.push(entry);
                                    fallbackMatches.sort((a, b) => b.score - a.score);
                                } else if (entry.score > fallbackMatches[fallbackMatches.length - 1].score) {
                                    fallbackMatches[fallbackMatches.length - 1] = entry;
                                    fallbackMatches.sort((a, b) => b.score - a.score);
                                }
                            }
                        }
                    }
                }
            }

            optState.results = exactMatches.length > 0 ? exactMatches : fallbackMatches;
            optState.meta = {
                totalTested: tested,
                exactFound: exactMatches.length > 0,
                ms: Math.round(performance.now() - t0),
                missingSlot: false
            };

            if (rerender) afficherVue();
        }

        async function equiperEnsembleOptimise(idx) {
            const set = optState.results[idx];
            if (!set || !joueurInfo || !persoActifId) return;

            const mType = joueurInfo.membershipType;
            const nomPerso = mapPersos[persoActifId]?.classeNom || 'Perso';
            const legendairesAEquiper = [];
            let exotiqueAEquiper = null;

            try {
                setStatus(`Préparation de l'ensemble T${set.totalTiers} pour ton ${nomPerso}...`);

                for (const piece of set.pieces) {
                    const dejaEquipe = mapPersos[persoActifId].equipped.find(x => x.itemInstanceId === piece.itemInstanceId);
                    if (dejaEquipe) continue;

                    // Si sur un autre perso (rare pour armures), passer par le coffre
                    if (piece.lieuType === 'inventory' && piece.charIdOwner && piece.charIdOwner !== persoActifId) {
                        await appelActionBungie('TransferItem', {
                            itemReferenceHash: piece.itemHash, stackSize: 1, transferToVault: true,
                            itemId: piece.itemInstanceId, characterId: piece.charIdOwner, membershipType: mType
                        });
                    }
                    if (piece.lieuType === 'vault' || (piece.lieuType === 'inventory' && piece.charIdOwner !== persoActifId)) {
                        setStatus(`Rapatriement de "${piece.nom}"...`);
                        const pull = await appelActionBungie('TransferItem', {
                            itemReferenceHash: piece.itemHash, stackSize: 1, transferToVault: false,
                            itemId: piece.itemInstanceId, characterId: persoActifId, membershipType: mType
                        });
                        if (pull.ErrorCode !== 1) throw new Error(pull.Message);
                    }

                    if (piece.tier === 'Exotic') exotiqueAEquiper = piece.itemInstanceId;
                    else legendairesAEquiper.push(piece.itemInstanceId);
                }

                // Équiper d'abord les Légendaires (libère l'ancien slot exotique si besoin), puis l'Exotique
                if (legendairesAEquiper.length > 0) {
                    const eqL = await appelActionBungie('EquipItems', {
                        itemIds: legendairesAEquiper, characterId: persoActifId, membershipType: mType
                    });
                    if (eqL.ErrorCode !== 1) throw new Error(eqL.Message);
                }
                if (exotiqueAEquiper) {
                    const eqE = await appelActionBungie('EquipItem', {
                        itemId: exotiqueAEquiper, characterId: persoActifId, membershipType: mType
                    });
                    if (eqE.ErrorCode !== 1) throw new Error(eqE.Message);
                }

                setStatus(`Ensemble T${set.totalTiers} équipé en direct sur ton ${nomPerso} !`);
                await lancerAnalyse();
            } catch (e) {
                setStatus(`Refus Bungie : ${e.message} (En Orbite ou à la Tour requis).`);
            }
        }

        function sauvegarderSetOptimiseEnBuild(idx) {
            const set = optState.results[idx];
            const p = mapPersos[persoActifId];
            if (!set || !p) return;

            const exo = set.pieces.find(x => x.tier === 'Exotic');
            const nom = `Opti T${set.totalTiers}${exo ? ' — ' + exo.nom : ''}`;
            const armesActuelles = p.equipped.filter(i => i.categorie === 'weapon');
            const itemsBuild = [...armesActuelles, ...set.pieces].map(item => ({
                itemHash: item.itemHash,
                itemInstanceId: item.itemInstanceId,
                bucketHash: item.bucketHash,
                nom: item.nom
            }));

            const builds = chargerBuildsLocale();
            builds.push({ id: Date.now(), nom, items: itemsBuild });
            localStorage.setItem(getCleBuilds(), JSON.stringify(builds));
            setStatus(`Ensemble sauvegardé dans tes Builds sous le nom "${nom}" !`);
        }

        function rendreVueOptimiseur() {
            const p = mapPersos[persoActifId];
            if (!p) return `<p style="color:#64748b;">Connecte-toi avec Bungie.net pour optimiser les armures de ton Gardien.</p>`;

            const armuresClasse = collecterArmuresClasseActive();
            // Exotiques uniques pour le menu déroulant
            const mapExos = {};
            armuresClasse.filter(a => a.tier === 'Exotic' && a.bucketHash !== BUCKET_CLASS_ITEM).forEach(a => {
